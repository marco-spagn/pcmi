# PCMI CI: lint → unit/integration (race) → smoke → optional OpenAI E2E
# Coverage: sticky PR comment, job summary, artifacts (see scripts/ci_coverage_check.sh).
#
# ── Job DAG (needs →) ─────────────────────────────────────────────────────────
# Wave 1 (parallel):
#   golangci-lint | security | helm-lint | trivy-images | go
# Wave 2 (after Wave 1 subsets):
#   integration-smoke  → needs [go, golangci-lint, security, trivy-images]
#   integration-e2e    → needs [go, golangci-lint]  (skips if no OPENAI_API_KEY; no retry)
# CodeQL: separate workflow (.github/workflows/codeql.yml)
# Local parity: make ci-like-github → scripts/ci_like_github.sh (phases A–G)
# Version for smoke: scripts/ci/resolve_version.sh (internal/version/version.go)

name: CI

on:
  push:
    branches:
      - main
      - release/**
      - develop
    paths-ignore:
      - 'badges/**'

  pull_request:
    branches:
      - main
      - release/**
      - develop
      - feat/**
      - feature/**

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  security:
    name: Security scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          chmod +x scripts/ci/phases/c_govulncheck.sh
          scripts/ci/phases/c_govulncheck.sh

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: helm lint --strict
        run: helm lint deploy/helm/pcmi --strict

      - name: helm template (renders default values)
        run: helm template pcmi deploy/helm/pcmi > /tmp/pcmi-rendered.yaml

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: kubeconform validate
        run: |
          kubeconform -summary -strict -schema-location default \
            /tmp/pcmi-rendered.yaml

  trivy-images:
    name: Trivy image scan (API + Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Skip notice (act only)
        if: ${{ env.ACT == 'true' }}
        run: echo "::notice::trivy-images skipped under act; run 'make act-trivy' locally"

      - uses: actions/checkout@v6
        if: ${{ env.ACT != 'true' }}

      - name: Set up Docker Buildx
        if: ${{ env.ACT != 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Build and scan images (Trivy)
        if: ${{ env.ACT != 'true' }}
        run: |
          chmod +x scripts/ci/trivy_images.sh
          scripts/ci/trivy_images.sh

  go:
    name: Go build, vet & test + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pcmi
          POSTGRES_USER: pcmi
          POSTGRES_PASSWORD: pcmi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcmi -d pcmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Static checks (build, vet, config audit)
        run: |
          chmod +x scripts/ci/phases/a_go_static.sh
          scripts/ci/phases/a_go_static.sh

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - uses: ./.github/actions/pcmi-postgres-migrate

      - name: Test (race detector + integration + coverage)
        env:
          DATABASE_URL: postgres://pcmi:pcmi@127.0.0.1:5432/pcmi?sslmode=disable
          PCMI_ENCRYPTION_KEY: "01234567890123456789012345678901"
          SKIP_COVERAGE: "1"
        run: |
          chmod +x scripts/ci/phases/f_go_integration.sh
          scripts/ci/phases/f_go_integration.sh

      - name: Enforce coverage thresholds
        run: |
          # shellcheck disable=SC1091
          source scripts/ci/coverage_env.sh
          chmod +x scripts/ci_coverage_check.sh
          scripts/ci_coverage_check.sh

      - name: Publish coverage to job summary
        if: ${{ always() && hashFiles('coverage-summary.md') != '' }}
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve PR for coverage comment
        id: cov_pr
        if: ${{ always() && hashFiles('coverage-summary.md') != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            let n = '';
            if (context.eventName === 'pull_request') {
              n = String(context.payload.pull_request.number);
            } else if (context.eventName === 'push') {
              const branch = context.ref.replace('refs/heads/', '');
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open',
              });
              if (prs.length) n = String(prs[0].number);
            }
            core.setOutput('number', n);

      - name: Comment coverage on PR
        if: ${{ always() && hashFiles('coverage-summary.md') != '' && steps.cov_pr.outputs.number != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pcmi-coverage
          number: ${{ steps.cov_pr.outputs.number }}
          path: coverage-summary.md

      - name: Upload coverage artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.out
            coverage-summary.md
            coverage-badge.txt
            badges/coverage.json
          retention-days: 14

      # Branch protection blocks direct push to main; open/update a bot PR instead.
      # Loop prevention: on.push.paths-ignore badges/** + [skip ci] in commit message.
      - name: Open PR for dynamic coverage badge (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('badges/coverage.json') != '' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(ci): update coverage badge [skip ci]"
          committer: pcmi-ci[bot] <pcmi-ci@users.noreply.github.com>
          author: pcmi-ci[bot] <pcmi-ci@users.noreply.github.com>
          branch: chore/coverage-badge
          delete-branch: true
          title: "chore(ci): update coverage badge"
          body: |
            Updates shields.io endpoint JSON for the README coverage badge.

            Generated by `scripts/ci_coverage_check.sh` after commit `${{ github.sha }}`.
            Merge when convenient; `paths-ignore: badges/**` and `[skip ci]` avoid CI loops.
          add-paths: |
            badges/coverage.json

  integration-smoke:
    name: Integration smoke (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [go, golangci-lint, security, trivy-images]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pcmi
          POSTGRES_USER: pcmi
          POSTGRES_PASSWORD: pcmi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcmi -d pcmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Skip notice (act only)
        if: ${{ env.ACT == 'true' }}
        run: echo "::notice::integration-smoke skipped under act — run 'make act-integration-smoke' locally"

      - uses: actions/setup-go@v5
        if: ${{ env.ACT != 'true' }}
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/pcmi-resolve-version
        if: ${{ env.ACT != 'true' }}
        id: api_version

      - name: Install tooling
        if: ${{ env.ACT != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq curl

      - uses: ./.github/actions/pcmi-postgres-migrate
        if: ${{ env.ACT != 'true' }}

      - name: Build and start API + worker
        if: ${{ env.ACT != 'true' }}
        run: |
          chmod +x scripts/ci/start_api_worker.sh
          scripts/ci/start_api_worker.sh

      - name: Wait for API health
        if: ${{ env.ACT != 'true' }}
        run: |
          chmod +x scripts/ci/wait_api_health.sh
          scripts/ci/wait_api_health.sh || {
            cat api.log 2>/dev/null || true
            cat worker.log 2>/dev/null || true
            exit 1
          }

      - name: Integration smoke suite (bash)
        if: ${{ env.ACT != 'true' }}
        env:
          PCMI_EXPECT_VERSION: ${{ steps.api_version.outputs.tag }}
          EXPECT_API_VERSION: ${{ steps.api_version.outputs.tag }}
          PGHOST: "127.0.0.1"
          API: "http://127.0.0.1:8000"
        run: |
          chmod +x scripts/ci_integration_smoke.sh
          ./scripts/ci_integration_smoke.sh

      - name: gRPC integration tests (Go)
        if: ${{ env.ACT != 'true' }}
        env:
          GRPC_HOST: 127.0.0.1:50051
          GRPC_TEST_API_KEY: testkey123
          DATABASE_URL: postgres://pcmi:pcmi@127.0.0.1:5432/pcmi?sslmode=disable
        run: go test -tags=integration -count=1 ./internal/grpc/...

      - name: SDK smoke (Python + TypeScript)
        if: ${{ env.ACT != 'true' }}
        env:
          PCMI_BASE_URL: http://127.0.0.1:8000
          PCMI_API_KEY: testkey123
        run: |
          chmod +x scripts/ci_sdk_smoke.sh
          ./scripts/ci_sdk_smoke.sh

      - name: Upload smoke logs on failure
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: integration-smoke-logs-${{ github.run_id }}
          path: |
            api.log
            worker.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure() && env.ACT != 'true'
        run: |
          cat api.log 2>/dev/null || true
          cat worker.log 2>/dev/null || true

      - name: Stop processes
        if: always() && env.ACT != 'true'
        run: |
          chmod +x scripts/ci/stop_api_worker.sh
          scripts/ci/stop_api_worker.sh

  integration-e2e:
    name: Integration E2E (docker compose + OpenAI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [go, golangci-lint]
    steps:
      - uses: actions/checkout@v6

      - id: openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY secret not set — skipping embedding E2E"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.openai.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Create .env for compose
        if: steps.openai.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > .env <<EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          DATABASE_URL=postgres://pcmi:pcmi@postgres:5432/pcmi
          REDIS_ADDR=redis:6379
          API_PORT=8000
          RATE_LIMIT_DISABLED=true
          EMBEDDING_MODEL=text-embedding-3-small
          DISTILLATION_MODEL=gpt-4o-mini
          EOF

      - name: Install test tooling
        if: steps.openai.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Start stack and run E2E scripts
        if: steps.openai.outputs.enabled == 'true'
        run: |
          chmod +x test_pcmi.sh scripts/e2e/test_pcmi.sh scripts/ci_e2e_sse_dedup.sh scripts/ci_e2e_finale.sh
          ./scripts/e2e/test_pcmi.sh
          ./scripts/ci_e2e_sse_dedup.sh
          ./scripts/ci_e2e_finale.sh

      - name: Upload compose logs on failure
        if: failure() && steps.openai.outputs.enabled == 'true'
        run: docker compose logs --tail=200 > compose-failure.log || true

      - name: Publish compose failure log
        if: failure() && steps.openai.outputs.enabled == 'true' && hashFiles('compose-failure.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: integration-e2e-logs-${{ github.run_id }}
          path: compose-failure.log
          retention-days: 7

      - name: Show compose logs on failure
        if: failure() && steps.openai.outputs.enabled == 'true'
        run: docker compose logs --tail=100

      - name: Cleanup compose
        if: always() && steps.openai.outputs.enabled == 'true'
        run: docker compose down -v --remove-orphans
