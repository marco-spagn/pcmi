# PCMI CI: Go build/vet + integration smoke + optional OpenAI E2E
# Coverage: sticky PR comment (pull_request + push with open PR), job summary,
# artifacts. Emoji in summary matches enforcement thresholds (see ci_coverage_check.sh).
#
# Minute saver: full pipeline only when the latest commit message contains CI_start
# (exact token) or on workflow_dispatch. Otherwise only ci-gate runs (~10s).
# Example: git commit -m "feat: widgets CI_start"

name: CI

# ── Triggers ottimizzati (evita esecuzione doppia push + PR) ──
on:
  push:
    branches:
      - main
      - release/**
      - develop
    # Skip CI when the only thing changed is the auto-committed coverage badge
    # JSON (see "Commit dynamic coverage badge" step in the go job). Without
    # this, every push that updates coverage would trigger another CI run that
    # produces an identical badge → infinite loop.
    paths-ignore:
      - 'badges/**'

  pull_request:
    branches:
      - main
      - release/**
      - develop
      - feat/**
      - feature/**

  workflow_dispatch:

# Cancella run precedenti sulla stessa PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # per sticky coverage comment
  # `contents: write` is granted at job-level on the go job only, used to push
  # the auto-generated badges/coverage.json back to main. PR builds keep the
  # default read-only token.

jobs:
  ci-gate:
    name: CI gate (CI_start)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: check
        name: Check commit message for CI_start
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CI enabled (workflow_dispatch)"
            exit 0
          fi
          MSG="$(git log -1 --pretty=%B)"
          echo "Latest commit message:"
          echo "$MSG"
          if echo "$MSG" | grep -Fq 'CI_start'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CI enabled — CI_start found in commit message"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI skipped — add CI_start to the commit message to run the pipeline (or trigger workflow_dispatch)"
          fi

  golangci-lint:
    name: golangci-lint
    needs: ci-gate
    if: needs.ci-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  security:
    name: Security scan (govulncheck)
    needs: ci-gate
    if: needs.ci-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  helm-lint:
    name: Helm chart lint
    needs: ci-gate
    if: needs.ci-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: helm lint --strict
        run: helm lint deploy/helm/pcmi --strict

      - name: helm template (renders default values)
        run: helm template pcmi deploy/helm/pcmi > /tmp/pcmi-rendered.yaml

      # Catch malformed manifests before they reach a cluster. kubeval
      # vendors Kubernetes OpenAPI schemas so we can validate offline.
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: kubeconform validate
        run: |
          kubeconform -summary -strict -schema-location default \
            /tmp/pcmi-rendered.yaml

  trivy-images:
    name: Trivy image scan (API + Worker)
    needs: ci-gate
    if: needs.ci-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip notice (act only)
        if: ${{ env.ACT == 'true' }}
        run: echo "::notice::trivy-images skipped under act; run 'make act-trivy' locally"

      - uses: actions/checkout@v6
        if: ${{ env.ACT != 'true' }}

      - name: Set up Docker Buildx
        if: ${{ env.ACT != 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Build pcmi-api image
        if: ${{ env.ACT != 'true' }}
        run: docker build -f Dockerfile.api -t pcmi-api:ci .

      - name: Build pcmi-worker image
        if: ${{ env.ACT != 'true' }}
        run: docker build -f Dockerfile.worker -t pcmi-worker:ci .

      - name: Trivy scan pcmi-api
        if: ${{ env.ACT != 'true' }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --scanners vuln \
            --format table \
            pcmi-api:ci

      - name: Trivy scan pcmi-worker
        if: ${{ env.ACT != 'true' }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --scanners vuln \
            --format table \
            pcmi-worker:ci

  go:
    name: Go build, vet & test + coverage
    needs: ci-gate
    if: needs.ci-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Job-level write permission so the final step can push the regenerated
    # badges/coverage.json back to main. All other jobs keep the workflow
    # default (read-only / pr-write).
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pcmi
          POSTGRES_USER: pcmi
          POSTGRES_PASSWORD: pcmi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcmi -d pcmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        env:
          PGPASSWORD: pcmi
        run: |
          for i in $(seq 1 30); do
            psql -h 127.0.0.1 -U pcmi -d pcmi -c 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          for f in migrations/*.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -U pcmi -d pcmi -v ON_ERROR_STOP=1 -f "$f"
          done

      # Fast structural invariant — runs before the heavy integration suite so
      # a rogue os.Getenv lands as a 5-second failure, not a 5-minute one.
      # Test source: internal/config/getenv_audit_test.go (PR #2).
      - name: Audit — no os.Getenv outside internal/config
        run: |
          go test -count=1 ./internal/config/... \
            -run 'TestNoOSGetenvOutsideConfig|TestEnvExampleStaysInSyncWithConfig'

      - name: Test (with race detector + coverage)
        env:
          DATABASE_URL: postgres://pcmi:pcmi@127.0.0.1:5432/pcmi?sslmode=disable
          PCMI_ENCRYPTION_KEY: "01234567890123456789012345678901"
        run: |
          go test -race -count=1 -tags=integration \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./internal/...

      - name: Enforce coverage thresholds
        env:
          # Global % is over "hand-written" statements only: COVERAGE_OMIT_PROTOBUF strips
          # generated grpc/pcmiv1 *.pb.go (see scripts/ci_coverage_check.sh). Floors match
          # what `go test ./internal/...` + Postgres integration exercises today; raise them as
          # handler/grpc coverage grows.
          COVERAGE_MIN_TOTAL: "39"
          COVERAGE_PKG_FLOORS: "config:70,event:70,eventschema:85,repository:70,service:70,worker:19"
          COVERAGE_OMIT_PROTOBUF: "true"
          COVERAGE_MD_OUT: coverage-summary.md
          COVERAGE_BADGE_OUT: coverage-badge.txt
          # Shields.io "endpoint" JSON committed back to main → renders a fully
          # dynamic badge in the README without Codecov/Coveralls/gists.
          COVERAGE_ENDPOINT_OUT: badges/coverage.json
        run: |
          chmod +x scripts/ci_coverage_check.sh
          scripts/ci_coverage_check.sh

      - name: Publish coverage to job summary
        if: ${{ always() && hashFiles('coverage-summary.md') != '' }}
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve PR for coverage comment
        id: cov_pr
        if: ${{ always() && hashFiles('coverage-summary.md') != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            let n = '';
            if (context.eventName === 'pull_request') {
              n = String(context.payload.pull_request.number);
            } else if (context.eventName === 'push') {
              const branch = context.ref.replace('refs/heads/', '');
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open',
              });
              if (prs.length) n = String(prs[0].number);
            }
            core.setOutput('number', n);

      - name: Comment coverage on PR
        if: ${{ always() && hashFiles('coverage-summary.md') != '' && steps.cov_pr.outputs.number != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pcmi-coverage
          number: ${{ steps.cov_pr.outputs.number }}
          path: coverage-summary.md

      - name: Upload coverage artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.out
            coverage-summary.md
            coverage-badge.txt
            badges/coverage.json
          retention-days: 14

      # Commit the regenerated coverage endpoint JSON back to main so the
      # README badge updates the moment a reviewer opens the repo. This step
      # only runs on push events targeting main; PR builds never commit.
      #
      # The push trigger has paths-ignore: ['badges/**'], so this auto-commit
      # cannot cause an infinite CI loop. [skip ci] in the commit message is a
      # belt-and-braces safeguard.
      - name: Commit dynamic coverage badge (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('badges/coverage.json') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- badges/coverage.json; then
            echo "badge unchanged — skipping commit"
            exit 0
          fi
          git config user.name "pcmi-ci[bot]"
          git config user.email "pcmi-ci@users.noreply.github.com"
          git add badges/coverage.json
          git commit -m "chore(ci): update coverage badge [skip ci]" \
            -m "Generated by scripts/ci_coverage_check.sh on commit ${GITHUB_SHA::8}."
          git push origin HEAD:main

  integration-smoke:
    name: Integration smoke (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: [ci-gate, go, golangci-lint, security, trivy-images]
    if: needs.ci-gate.outputs.run == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pcmi
          POSTGRES_USER: pcmi
          POSTGRES_PASSWORD: pcmi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcmi -d pcmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Skip notice (act only)
        if: ${{ env.ACT == 'true' }}
        run: echo "::notice::integration-smoke skipped under act — run 'make act-integration-smoke' locally"

      - uses: actions/setup-go@v5
        if: ${{ env.ACT != 'true' }}
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tooling
        if: ${{ env.ACT != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq curl

      - name: Apply migrations
        if: ${{ env.ACT != 'true' }}
        env:
          PGPASSWORD: pcmi
        run: |
          for i in $(seq 1 30); do
            psql -h 127.0.0.1 -U pcmi -d pcmi -c 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          for f in migrations/*.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -U pcmi -d pcmi -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build and start API + worker
        if: ${{ env.ACT != 'true' }}
        env:
          DATABASE_URL: postgres://pcmi:pcmi@127.0.0.1:5432/pcmi?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          API_PORT: "8000"
          GRPC_PORT: "50051"
          RATE_LIMIT_DISABLED: "true"
          PCMI_ENCRYPTION_KEY: "01234567890123456789012345678901"
          PRUNE_INTERVAL_SECS: "3600"
          EXPIRY_INTERVAL_SECS: "2"
          WEBHOOK_MAX_ATTEMPTS: "2"
        run: |
          go build -o bin/pcmi-api ./cmd/api
          go build -o bin/pcmi-worker ./cmd/worker
          ./bin/pcmi-api > api.log 2>&1 &
          echo $! > api.pid
          ./bin/pcmi-worker > worker.log 2>&1 &
          echo $! > worker.pid

      - name: Wait for API health
        if: ${{ env.ACT != 'true' }}
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8000/v1/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          cat api.log || true
          cat worker.log || true
          exit 1

      - name: Integration smoke suite (bash)
        if: ${{ env.ACT != 'true' }}
        env:
          PCMI_EXPECT_VERSION: v1.45.0
          EXPECT_API_VERSION: v1.45.0
          PGHOST: "127.0.0.1"
          API: "http://127.0.0.1:8000"
        run: |
          chmod +x scripts/ci_integration_smoke.sh
          ./scripts/ci_integration_smoke.sh

      - name: gRPC integration tests (Go)
        if: ${{ env.ACT != 'true' }}
        env:
          GRPC_HOST: 127.0.0.1:50051
          GRPC_TEST_API_KEY: testkey123
          DATABASE_URL: postgres://pcmi:pcmi@127.0.0.1:5432/pcmi?sslmode=disable
        run: go test -tags=integration -count=1 ./internal/grpc/...

      - name: SDK smoke (Python + TypeScript)
        if: ${{ env.ACT != 'true' }}
        env:
          PCMI_BASE_URL: http://127.0.0.1:8000
          PCMI_API_KEY: testkey123
        run: |
          chmod +x scripts/ci_sdk_smoke.sh
          ./scripts/ci_sdk_smoke.sh

      - name: Show logs on failure
        if: ${{ failure() && env.ACT != 'true' }}
        run: |
          cat api.log 2>/dev/null || true
          cat worker.log 2>/dev/null || true

      - name: Stop processes
        if: ${{ always() && env.ACT != 'true' }}
        run: |
          for f in api.pid worker.pid; do
            [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
          done

  integration-e2e:
    name: Integration E2E (docker compose + OpenAI)
    runs-on: ubuntu-latest
    needs: [ci-gate, go, golangci-lint]
    if: needs.ci-gate.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v6

      - id: openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY secret not set — skipping embedding E2E"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.openai.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Create .env for compose
        if: steps.openai.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > .env <<EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          DATABASE_URL=postgres://pcmi:pcmi@postgres:5432/pcmi
          REDIS_ADDR=redis:6379
          API_PORT=8000
          RATE_LIMIT_DISABLED=true
          EMBEDDING_MODEL=text-embedding-3-small
          DISTILLATION_MODEL=gpt-4o-mini
          EOF

      - name: Install test tooling
        if: steps.openai.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Start stack and run E2E scripts
        if: steps.openai.outputs.enabled == 'true'
        run: |
          chmod +x test_pcmi.sh scripts/e2e/test_pcmi.sh scripts/ci_e2e_sse_dedup.sh scripts/ci_e2e_finale.sh
          ./scripts/e2e/test_pcmi.sh
          ./scripts/ci_e2e_sse_dedup.sh
          ./scripts/ci_e2e_finale.sh

      - name: Show compose logs on failure
        if: failure() && steps.openai.outputs.enabled == 'true'
        run: docker compose logs --tail=100

      - name: Cleanup compose
        if: always() && steps.openai.outputs.enabled == 'true'
        run: docker compose down -v --remove-orphans