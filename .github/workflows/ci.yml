# PCMI CI: Go build/vet + integration smoke (no secrets) + optional OpenAI E2E.
#
# Optional repository secret (Settings → Secrets → Actions):
#   OPENAI_API_KEY — enables the integration-e2e job (docker compose + embedding tests).
# Without it, go + integration-smoke still run on every push/PR.

name: CI

on:
  push:
    branches:
      - main
      - release/*
      - feat/*
      - feature/*
      - develop/*
      # legacy: open PRs still on pr/* until merged
      - pr/v1.8.0
      - pr/v1.9.0
      - pr/v1.10.0
      - pr/v1.11.0
  pull_request:
    branches:
      - main
      - release/*
      - feat/*
      - feature/*
      - develop/*
      - pr/v1.8.0
      - pr/v1.9.0
      - pr/v1.10.0
      - pr/v1.11.0

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  security:
    name: Security scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  go:
    name: Go build, vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector + coverage)
        run: |
          go test -race -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./internal/event/... \
            ./internal/eventschema/... \
            ./internal/handler/... \
            ./internal/middleware/... \
            ./internal/repository/... \
            ./internal/service/... \
            ./internal/version/... \
            ./internal/webhook/... \
            ./internal/worker/...

      - name: Print coverage summary
        run: |
          echo "=== Total coverage ==="
          go tool cover -func=coverage.out | tail -1
          echo ""
          echo "=== Top uncovered functions ==="
          go tool cover -func=coverage.out | grep -v "100.0%" | sort -t$'\t' -k3 -n | tail -20 || true

  integration-smoke:
    name: Integration smoke (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: [go, golangci-lint, security]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pcmi
          POSTGRES_USER: pcmi
          POSTGRES_PASSWORD: pcmi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcmi -d pcmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq curl

      - name: Apply migrations
        env:
          PGPASSWORD: pcmi
        run: |
          for i in $(seq 1 30); do
            psql -h localhost -U pcmi -d pcmi -c 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          for f in migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U pcmi -d pcmi -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build and start API + worker
        env:
          DATABASE_URL: postgres://pcmi:pcmi@localhost:5432/pcmi?sslmode=disable
          REDIS_ADDR: localhost:6379
          API_PORT: "8000"
          GRPC_PORT: "50051"
          RATE_LIMIT_DISABLED: "true"
          PCMI_ENCRYPTION_KEY: "01234567890123456789012345678901"
          PRUNE_INTERVAL_SECS: "3600"
          EXPIRY_INTERVAL_SECS: "2"
          WEBHOOK_MAX_ATTEMPTS: "2"
        run: |
          go build -o bin/pcmi-api ./cmd/api
          go build -o bin/pcmi-worker ./cmd/worker
          ./bin/pcmi-api > api.log 2>&1 &
          echo $! > api.pid
          ./bin/pcmi-worker > worker.log 2>&1 &
          echo $! > worker.pid

      - name: Wait for API health
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/v1/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          cat api.log || true
          cat worker.log || true
          exit 1

      - name: Integration smoke suite (bash)
        env:
          PCMI_EXPECT_VERSION: v1.33.0
          EXPECT_API_VERSION: v1.33.0
        run: |
          chmod +x scripts/ci_integration_smoke.sh
          ./scripts/ci_integration_smoke.sh

      - name: gRPC integration tests (Go)
        env:
          GRPC_HOST: localhost:50051
          GRPC_TEST_API_KEY: testkey123
          DATABASE_URL: postgres://pcmi:pcmi@localhost:5432/pcmi?sslmode=disable
        run: go test -tags=integration -count=1 ./internal/grpc/...

      - name: SDK smoke (Python + TypeScript)
        env:
          PCMI_BASE_URL: http://localhost:8000
          PCMI_API_KEY: testkey123
        run: |
          chmod +x scripts/ci_sdk_smoke.sh
          ./scripts/ci_sdk_smoke.sh

      - name: Show logs on failure
        if: failure()
        run: |
          cat api.log 2>/dev/null || true
          cat worker.log 2>/dev/null || true

      - name: Stop processes
        if: always()
        run: |
          for f in api.pid worker.pid; do
            [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
          done

  integration-e2e:
    name: Integration E2E (docker compose + OpenAI)
    runs-on: ubuntu-latest
    needs: [go, golangci-lint]
    steps:
      - uses: actions/checkout@v4

      - id: openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY secret not set — skipping embedding E2E"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.openai.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Create .env for compose
        if: steps.openai.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > .env <<EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          DATABASE_URL=postgres://pcmi:pcmi@postgres:5432/pcmi
          REDIS_ADDR=redis:6379
          API_PORT=8000
          RATE_LIMIT_DISABLED=true
          EMBEDDING_MODEL=text-embedding-3-small
          DISTILLATION_MODEL=gpt-4o-mini
          EOF

      - name: Install test tooling
        if: steps.openai.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Start stack and run E2E scripts
        if: steps.openai.outputs.enabled == 'true'
        run: |
          chmod +x test_pcmi.sh scripts/ci_e2e_sse_dedup.sh scripts/ci_e2e_finale.sh
          ./test_pcmi.sh
          ./scripts/ci_e2e_sse_dedup.sh
          ./scripts/ci_e2e_finale.sh

      - name: Show compose logs on failure
        if: failure() && steps.openai.outputs.enabled == 'true'
        run: docker compose logs --tail=100

      - name: Cleanup compose
        if: always() && steps.openai.outputs.enabled == 'true'
        run: docker compose down -v --remove-orphans
