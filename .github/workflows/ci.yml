# PCMI CI: Go build/vet + integration smoke (no secrets) + optional OpenAI E2E.
#
# Optional repository secret (Settings → Secrets → Actions):
#   OPENAI_API_KEY — enables the integration-e2e job (docker compose + embedding tests).
# Without it, go + integration-smoke still run on every push/PR.

name: CI

on:
  push:
    branches:
      - main
      - release/*
      - feature/*
      - develop/*
      # legacy: open PRs still on pr/* until merged
      - pr/v1.8.0
      - pr/v1.9.0
      - pr/v1.10.0
      - pr/v1.11.0
  pull_request:
    branches:
      - main
      - release/*
      - feature/*
      - develop/*
      - pr/v1.8.0
      - pr/v1.9.0
      - pr/v1.10.0
      - pr/v1.11.0

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  go:
    name: Go build, vet & test
    needs: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  integration-smoke:
    name: Integration smoke (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: go
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pcmi
          POSTGRES_USER: pcmi
          POSTGRES_PASSWORD: pcmi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcmi -d pcmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq curl

      - name: Apply migrations
        env:
          PGPASSWORD: pcmi
        run: |
          for i in $(seq 1 30); do
            psql -h localhost -U pcmi -d pcmi -c 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          for f in migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U pcmi -d pcmi -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build and start API + worker
        env:
          DATABASE_URL: postgres://pcmi:pcmi@localhost:5432/pcmi?sslmode=disable
          REDIS_ADDR: localhost:6379
          API_PORT: "8000"
          RATE_LIMIT_DISABLED: "true"
          PCMI_ENCRYPTION_KEY: "01234567890123456789012345678901"
          PRUNE_INTERVAL_SECS: "3600"
          WEBHOOK_MAX_ATTEMPTS: "2"
        run: |
          go build -o bin/pcmi-api ./cmd/api
          go build -o bin/pcmi-worker ./cmd/worker
          ./bin/pcmi-api > api.log 2>&1 &
          echo $! > api.pid
          ./bin/pcmi-worker > worker.log 2>&1 &
          echo $! > worker.pid

      - name: Wait for API health
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/v1/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          cat api.log || true
          cat worker.log || true
          exit 1

      - name: Store and retrieve memory (no OpenAI)
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"root.ci.${SUFFIX}\",\"content\":\"CI smoke test\",\"metadata\":{},\"embedding_model\":\"text-embedding-3-small\",\"tags\":[\"ci\"]}" \
            | jq -e '.id'

          curl -sf -X POST http://localhost:8000/v1/retrieve \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d '{"path_prefix":"root.ci","limit":10}' \
            | jq -e '.entries | length >= 1'

          curl -sf "http://localhost:8000/v1/distilled?path_prefix=root.ci&limit=5" \
            -H "X-API-Key: testkey123" \
            | jq -e '(.entries | type) == "array"'

      - name: Temporal append-only store smoke
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          PATH_V="root.ci.temporal.${SUFFIX}"
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"${PATH_V}\",\"content\":\"version-one\",\"metadata\":{}}" \
            | jq -e '.version == 1'
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"${PATH_V}\",\"content\":\"version-two\",\"metadata\":{}}" \
            | jq -e '.version == 2 and (.superseded_id | type) == "number"'
          CONTENT=$(curl -sf -X POST http://localhost:8000/v1/retrieve \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path_prefix\":\"${PATH_V}\",\"limit\":5}" \
            | jq -r '.entries[0].content')
          test "$CONTENT" = "version-two"

      - name: SSE events stream smoke
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          EVENT_LOG=$(mktemp)
          curl -sN --max-time 12 "http://localhost:8000/v1/events?types=memory.stored" \
            -H "X-API-Key: testkey123" \
            -H "Accept: text/event-stream" > "$EVENT_LOG" &
          STREAM_PID=$!
          sleep 2
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"root.ci.events.${SUFFIX}\",\"content\":\"event smoke\",\"metadata\":{}}" \
            | jq -e '.id'
          sleep 4
          kill "$STREAM_PID" 2>/dev/null || true
          wait "$STREAM_PID" 2>/dev/null || true
          grep -q 'memory.stored' "$EVENT_LOG"

      - name: Temporal rollback smoke
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          PATH_V="root.ci.rollback.${SUFFIX}"
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"${PATH_V}\",\"content\":\"alpha\",\"metadata\":{}}" \
            | jq -e '.version == 1'
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"${PATH_V}\",\"content\":\"beta\",\"metadata\":{}}" \
            | jq -e '.version == 2'
          curl -sf -X POST http://localhost:8000/v1/memories/rollback \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"${PATH_V}\",\"version\":1}" \
            | jq -e '.restored_from_version == 1 and .version == 3'
          CONTENT=$(curl -sf -X POST http://localhost:8000/v1/retrieve \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path_prefix\":\"${PATH_V}\",\"limit\":5}" \
            | jq -r '.entries[0].content')
          test "$CONTENT" = "alpha"

      - name: Audit log API smoke
        run: |
          set -euo pipefail
          curl -sf "http://localhost:8000/v1/audit?limit=10" \
            -H "X-API-Key: testkey123" \
            | jq -e '(.entries | type) == "array" and (.total | type) == "number" and (.total >= 1)'

      - name: Universal event ingestion smoke
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          curl -sf -X POST http://localhost:8000/v1/events \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"event_type\":\"agent.step.completed\",\"payload\":{\"step\":\"ci.${SUFFIX}\"}}" \
            | jq -e '.status == "ingested" and (.id | type) == "string"'

      - name: Memory history reconstruction smoke
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          PATH_V="root.ci.history.${SUFFIX}"
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"${PATH_V}\",\"content\":\"v1\",\"metadata\":{}}" \
            | jq -e '.version == 1'
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"${PATH_V}\",\"content\":\"v2\",\"metadata\":{}}" \
            | jq -e '.version == 2'
          curl -sf "http://localhost:8000/v1/memories/history?path=${PATH_V}" \
            -H "X-API-Key: testkey123" \
            | jq -e '(.entries | length) == 2 and .entries[0].version == 2'

      - name: v1.12 encrypted content smoke
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          PATH_V="root.ci.encrypt.${SUFFIX}"
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"${PATH_V}\",\"content\":\"top-secret-${SUFFIX}\",\"metadata\":{\"sensitive\":true},\"embedding_model\":\"unspecified\"}" \
            | jq -e '.id'
          CONTENT=$(curl -sf -X POST http://localhost:8000/v1/retrieve \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path_prefix\":\"${PATH_V}\",\"limit\":5}" \
            | jq -r '.entries[0].content')
          test "$CONTENT" = "top-secret-${SUFFIX}"
          STORED=$(PGPASSWORD=pcmi psql -h localhost -U pcmi -d pcmi -tA -c \
            "SELECT content FROM memory_entries WHERE path='${PATH_V}'::ltree AND valid_to IS NULL LIMIT 1")
          echo "$STORED" | grep -q '^enc:v1:' || { echo "expected encrypted at rest"; exit 1; }

      - name: v1.12 webhook delivery smoke
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          python3 - <<'PY' &
          import json, threading, time
          from http.server import BaseHTTPRequestHandler, HTTPServer
          hits = []
          class H(BaseHTTPRequestHandler):
            def do_POST(self):
              n = int(self.headers.get("Content-Length", 0))
              hits.append(self.rfile.read(n))
              with open("/tmp/webhook_hits.json", "w", encoding="utf-8") as f:
                f.write(json.dumps([h.decode() for h in hits]))
              self.send_response(200); self.end_headers()
            def log_message(self, *a): pass
          srv = HTTPServer(("127.0.0.1", 9876), H)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          while True:
            time.sleep(1)
          PY
          WH_PID=$!
          sleep 1
          curl -sf -X POST http://localhost:8000/v1/webhooks \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d '{"url":"http://127.0.0.1:9876/hook","event_types":["memory.stored"],"secret":"ci-secret"}' \
            | jq -e '.status == "registered"'
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"root.ci.webhook.${SUFFIX}\",\"content\":\"wh\",\"metadata\":{}}" \
            | jq -e '.id'
          sleep 8
          kill "$WH_PID" 2>/dev/null || true
          test -f /tmp/webhook_hits.json
          python3 -c "import json; hits=json.load(open('/tmp/webhook_hits.json')); assert hits, 'no webhook delivery'; assert 'memory.stored' in hits[0]"

      - name: v1.12 embedding migration smoke
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          PATH_P="root.ci.migrate.${SUFFIX}"
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"${PATH_P}\",\"content\":\"migrate-me\",\"metadata\":{},\"embedding_model\":\"text-embedding-3-small\"}" \
            | jq -e '.id'
          curl -sf -X POST http://localhost:8000/v1/embeddings/migrate \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path_prefix\":\"${PATH_P}\",\"target_model\":\"text-embedding-3-large\"}" \
            | jq -e '.marked_count >= 1'
          PGPASSWORD=pcmi psql -h localhost -U pcmi -d pcmi -tA -c \
            "SELECT embedding IS NULL AND embedding_model='text-embedding-3-large' FROM memory_entries WHERE path='${PATH_P}'::ltree AND valid_to IS NULL" \
            | grep -q '^t'

      - name: v1.12 distilled versioning smoke
        run: |
          set -euo pipefail
          PGPASSWORD=pcmi psql -h localhost -U pcmi -d pcmi -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO distilled_knowledge (tenant_id, path, summary, insights, confidence_score, source_entry_ids, version)
          VALUES ('00000000-0000-0000-0000-000000000000', 'root.ci.distilled.version', 'v1 summary', '[]', 0.9, ARRAY[1]::bigint[], 1);
          INSERT INTO distilled_knowledge (tenant_id, path, summary, insights, confidence_score, source_entry_ids, version)
          VALUES ('00000000-0000-0000-0000-000000000000', 'root.ci.distilled.version', 'v2 summary', '[]', 0.9, ARRAY[2]::bigint[], 2);
          SQL
          MAX_VER=$(curl -sf "http://localhost:8000/v1/distilled?path_prefix=root.ci.distilled&limit=10" \
            -H "X-API-Key: testkey123" | jq '[.entries[].version] | max')
          test "$MAX_VER" -ge 2

      - name: v1.12 pruning function smoke
        run: |
          set -euo pipefail
          PGPASSWORD=pcmi psql -h localhost -U pcmi -d pcmi -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO memory_entries (tenant_id, path, content, metadata, embedding_model, version, valid_from, valid_to)
          VALUES ('00000000-0000-0000-0000-000000000000', 'root.ci.prune.old', 'stale', '{}', 'unspecified', 1,
                  NOW() - interval '60 days', NOW() - interval '45 days');
          SQL
          PRUNED=$(PGPASSWORD=pcmi psql -h localhost -U pcmi -d pcmi -tA -c "SELECT prune_superseded_memories(30)")
          test "$PRUNED" -ge 1
          COUNT=$(PGPASSWORD=pcmi psql -h localhost -U pcmi -d pcmi -tA -c \
            "SELECT COUNT(*) FROM memory_entries WHERE path='root.ci.prune.old'::ltree")
          test "$COUNT" -eq 0

      - name: v1.13 event schema registry smoke
        run: |
          set -euo pipefail
          curl -sf http://localhost:8000/v1/events/schemas \
            -H "X-API-Key: testkey123" \
            | jq -e '(.schemas | length) >= 5 and (.total >= 5)'

      - name: v1.13 event schema validation smoke
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/v1/events \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d '{"event_type":"agent.step.failed","payload":{}}')
          test "$code" = "400"

      - name: v1.13 memory summarize smoke
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          PATH_V="root.ci.summarize.${SUFFIX}"
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"${PATH_V}\",\"content\":\"Summarize me: alpha beta gamma\",\"metadata\":{}}" \
            | jq -e '.id'
          curl -sf -X POST http://localhost:8000/v1/memories/summarize \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path_prefix\":\"${PATH_V}\",\"limit\":5,\"style\":\"brief\"}" \
            | jq -e '.method == "extractive" and (.summary | length) > 0 and (.total >= 1)'

      - name: v1.13 API pool metrics smoke
        run: |
          set -euo pipefail
          curl -sf http://localhost:8000/v1/health | jq -e '.pool.total_conns >= 1 and .version == "v1.13.0"'

      - name: v1.13 webhook dead-letter smoke
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          curl -sf -X POST http://localhost:8000/v1/webhooks \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d '{"url":"http://127.0.0.1:9/dead","event_types":["memory.stored"],"secret":""}' \
            | jq -e '.status == "registered"'
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"root.ci.dlq.${SUFFIX}\",\"content\":\"dlq\",\"metadata\":{}}" \
            | jq -e '.id'
          for i in $(seq 1 30); do
            n=$(curl -sf "http://localhost:8000/v1/webhooks/dead-letter?limit=10" \
              -H "X-API-Key: testkey123" | jq '.total')
            if [ "${n:-0}" -ge 1 ]; then
              echo "dead-letter count=${n}"
              exit 0
            fi
            sleep 2
          done
          echo "no dead-letter deliveries"
          exit 1

      - name: Cross-agent scope and embedding space smoke
        run: |
          set -euo pipefail
          SUFFIX=$(date +%s)
          AGENT="00000000-0000-0000-0000-000000000001"
          PATH_A="root.ci.scope.${SUFFIX}"
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"${PATH_A}\",\"content\":\"agent-one\",\"metadata\":{},\"source_agent_id\":\"${AGENT}\",\"embedding_space\":\"experimental\"}"
          curl -sf -X POST http://localhost:8000/v1/memories \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path\":\"root.ci.scope.other.${SUFFIX}\",\"content\":\"agent-two\",\"metadata\":{}}"
          COUNT=$(curl -sf -X POST http://localhost:8000/v1/retrieve \
            -H "Content-Type: application/json" \
            -H "X-API-Key: testkey123" \
            -d "{\"path_prefix\":\"root.ci.scope\",\"source_agent_id\":\"${AGENT}\",\"embedding_space\":\"experimental\",\"limit\":20}" \
            | jq '.entries | length')
          test "$COUNT" -ge 1

      - name: Show logs on failure
        if: failure()
        run: |
          cat api.log 2>/dev/null || true
          cat worker.log 2>/dev/null || true

      - name: Stop processes
        if: always()
        run: |
          for f in api.pid worker.pid; do
            [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
          done

  integration-e2e:
    name: Integration E2E (docker compose + OpenAI)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - id: openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY secret not set — skipping embedding E2E"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.openai.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Create .env for compose
        if: steps.openai.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > .env <<EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          DATABASE_URL=postgres://pcmi:pcmi@postgres:5432/pcmi
          REDIS_ADDR=redis:6379
          API_PORT=8000
          EMBEDDING_MODEL=text-embedding-3-small
          DISTILLATION_MODEL=gpt-4o-mini
          EOF

      - name: Install test tooling
        if: steps.openai.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Start stack and run E2E scripts
        if: steps.openai.outputs.enabled == 'true'
        run: |
          chmod +x test_pcmi.sh scripts/ci_e2e_sse_dedup.sh scripts/ci_e2e_embedding.sh scripts/ci_e2e_finale.sh
          ./test_pcmi.sh
          ./scripts/ci_e2e_sse_dedup.sh
          ./scripts/ci_e2e_embedding.sh
          ./scripts/ci_e2e_finale.sh

      - name: Show compose logs on failure
        if: failure() && steps.openai.outputs.enabled == 'true'
        run: docker compose logs --tail=100

      - name: Cleanup compose
        if: always() && steps.openai.outputs.enabled == 'true'
        run: docker compose down -v --remove-orphans
