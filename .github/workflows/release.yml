# PCMI Release Pipeline
#
# Triggers:
#   push v*.*.*  → build binaries + create GitHub Release + push container (latest + tag)
#   push main    → push container (main tag only, no GitHub Release)
#
# Images: ghcr.io/marco-spagn/pcmi:{latest,vX.Y.Z} on tag; ghcr.io/marco-spagn/pcmi:main on main.
# See docs/API-VERSIONING.md for the release checklist.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build static binaries for all target platforms and attach to GitHub Release.
  # Skipped on plain main-branch pushes (only fires for annotated/lightweight tags).
  # ──────────────────────────────────────────────────────────────────────────
  release-binaries:
    name: Build binaries & GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Resolve tag
        id: tag
        run: echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.value }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify tag matches internal/version/version.go
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/resolve_version.sh
          source scripts/ci/resolve_version.sh
          if [[ "$RELEASE_TAG" != "$PCMI_EXPECT_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match version.go Tag $PCMI_EXPECT_VERSION" >&2
            exit 1
          fi
          echo "version.go Tag matches tag $RELEASE_TAG "

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes (cliff.toml)
        id: notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          git cliff --config cliff.toml --strip header --tag "$RELEASE_TAG" > release-notes.md
          echo "--- release-notes.md (first 40 lines) ---"
          head -40 release-notes.md

      - name: Build binaries (linux/amd64, linux/arm64, darwin/arm64)
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in "linux/amd64" "linux/arm64" "darwin/arm64"; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            for bin in api worker migrate; do
              out="dist/pcmi-${bin}_${goos}_${goarch}"
              echo "→ building ${out}"
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
                go build -trimpath -ldflags="-s -w" \
                -o "${out}" "./cmd/${bin}"
            done
          done

      - name: Compress & generate SHA256 checksums
        run: |
          set -euo pipefail
          cd dist
          for f in pcmi-*; do
            tar czf "${f}.tar.gz" "${f}"
            sha256sum "${f}.tar.gz" > "${f}.tar.gz.sha256"
            rm "${f}"
          done
          ls -lh .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # ──────────────────────────────────────────────────────────────────────────
  # Build multi-arch container image and push to ghcr.io.
  #   tag push  → ghcr.io/marco-spagn/pcmi:latest + ghcr.io/marco-spagn/pcmi:{tag}
  #   main push → ghcr.io/marco-spagn/pcmi:main
  # Runs after release-binaries on tag push; runs standalone on main push.
  # ──────────────────────────────────────────────────────────────────────────
  release-container:
    name: Publish container image (ghcr.io)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release-binaries]
    if: |
      always() &&
      !cancelled() &&
      needs.release-binaries.result != 'failure' &&
      (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tags
        id: meta
        run: |
          set -euo pipefail
          REPO="ghcr.io/marco-spagn/pcmi"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tags=${REPO}:latest,${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
            echo "label=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REPO}:main" >> "$GITHUB_OUTPUT"
            echo "label=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/marco-spagn/pcmi
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.label }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
