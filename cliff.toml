# git-cliff — PCMI release notes (see docs/API-VERSIONING.md)
# https://git-cliff.org/docs/configuration

[changelog]
header = "# Changelog\n\nAll notable changes to PCMI are documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),\nand the project follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\nThe \"Tag\" constant in `internal/version/version.go` is the source of truth for\nthe public API version exposed by `/v1/version` and the gRPC `Version` RPC.\n"
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}

{% else -%}
## [Unreleased]

{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.links %} ({{ commit.links | join(sep=", ") }}){% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^doc", group = "Documentation" },
  { message = "^docs", group = "Documentation" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Changed" },
  { message = "^test", group = "Changed" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Changed" },
  { message = "^infra", group = "Changed" },
  { message = "^security", group = "Security" },
  { body = ".*security", group = "Security" },
  { message = "^.*!", group = "Changed", scope = "breaking" },
]
commit_preprocessors = [
  { pattern = '\\((\\w+[-\\w]*)\\)', replace = "($1)" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
