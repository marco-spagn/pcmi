{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy — permette solo il traffico necessario tra i pod PCMI.
# Isola il database e Redis: nessun pod esterno al namespace può raggiungerli.

# ── API: accetta da ingress e da qualsiasi client nel cluster ────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pcmi.fullname" . }}-api
  labels:
    {{- include "pcmi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pcmi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP REST + gRPC da qualsiasi sorgente nel cluster (Ingress controller incluso)
    - ports:
        - port: 8000
          protocol: TCP
        - port: 50051
          protocol: TCP
  egress:
    # PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
    # Redis
    - ports:
        - port: 6379
          protocol: TCP
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # OpenAI API / OTEL collector (HTTPS egress)
    - ports:
        - port: 443
          protocol: TCP
---
# ── Worker: accetta solo health scrape; egress verso DB, Redis, OpenAI ───────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pcmi.fullname" . }}-worker
  labels:
    {{- include "pcmi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pcmi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Solo health/metrics scrape da Prometheus
    - ports:
        - port: 8081
          protocol: TCP
  egress:
    - ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 6379
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
