apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pcmi.fullname" . }}-secrets
  labels:
    {{- include "pcmi.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ default "" $v | quote }}
{{- end }}
{{- if .Values.tls.enabled }}
  # When TLS is on, the cert+key are expected to live in a separate
  # tls.secretName Secret (Opaque or kubernetes.io/tls). The chart wires the
  # file paths into the Pod envs so config.Load picks them up.
  PCMI_TLS_CERT: "/etc/pcmi/tls/tls.crt"
  PCMI_TLS_KEY: "/etc/pcmi/tls/tls.key"
{{- end }}
