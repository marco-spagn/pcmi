{{- if and .Values.worker.autoscaling.enabled .Values.worker.autoscaling.useCustomMetric }}
# Worker HPA basato su pcmi_distillation_queued_jobs (via Prometheus Adapter).
# Il worker è bound sull'OpenAI API, non sulla CPU — scalare su CPU non funziona.
# Prerequisito: prometheus-adapter installato con la regola custom metric sotto.
#
# Aggiungere a prometheus-adapter values.yaml:
#   rules:
#     custom:
#       - seriesQuery: 'pcmi_distillation_queued_jobs'
#         resources:
#           overrides:
#             namespace: {resource: "namespace"}
#         name:
#           matches: "pcmi_distillation_queued_jobs"
#           as: "pcmi_distillation_queued_jobs"
#         metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>})'
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "pcmi.fullname" . }}-worker
  labels:
    {{- include "pcmi.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "pcmi.fullname" . }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas | default 4 }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: pcmi_distillation_queued_jobs
        target:
          type: AverageValue
          # Scale up when each worker has >10 jobs queued on average.
          averageValue: "{{ .Values.worker.autoscaling.targetQueueDepth | default 10 }}"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}
