apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcmi-api
  namespace: pcmi
  labels:
    app: pcmi-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pcmi-api
  template:
    metadata:
      labels:
        app: pcmi-api
    spec:
      containers:
        - name: api
          image: pcmi-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pcmi-config
            - secretRef:
                name: pcmi-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pcmi-api
  namespace: pcmi
spec:
  selector:
    app: pcmi-api
  ports:
    - port: 80
      targetPort: 8000
