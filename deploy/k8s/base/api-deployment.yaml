apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcmi-api
  namespace: pcmi
  labels:
    app: pcmi-api
    app.kubernetes.io/name: pcmi-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pcmi-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # zero-downtime: nessun pod abbattuto prima che il nuovo sia Ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pcmi-api
        app.kubernetes.io/name: pcmi-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: pcmi-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pcmi-config
            - secretRef:
                name: pcmi-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # 60 s di grazia al primo avvio
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pcmi-api
  namespace: pcmi
spec:
  selector:
    app: pcmi-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
