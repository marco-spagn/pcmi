# Copy to secret.yaml and fill before apply. Do not commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: pcmi-secrets
  namespace: pcmi
type: Opaque
stringData:
  DATABASE_URL: postgres://pcmi:pcmi@postgres:5432/pcmi?sslmode=disable
  OPENAI_API_KEY: ""
  PCMI_ENCRYPTION_KEY: "01234567890123456789012345678901"
