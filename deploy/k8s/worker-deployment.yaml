apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcmi-worker
  namespace: pcmi
  labels:
    app: pcmi-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pcmi-worker
  template:
    metadata:
      labels:
        app: pcmi-worker
    spec:
      containers:
        - name: worker
          image: pcmi-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: pcmi-config
            - secretRef:
                name: pcmi-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
