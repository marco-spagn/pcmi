# ─────────────────────────────────────────────────────────────────────────────
# PCMI — Prometheus alert rules
#
# Load with:
#   docker run -v $(pwd)/deploy/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml \
#     ... prom/prometheus --config.file=/etc/prometheus/prometheus.yml
#
# Reference the file from prometheus.yml:
#   rule_files:
#     - /etc/prometheus/alerts.yaml
#
# All thresholds are conservative defaults — tune for your traffic profile.
# ─────────────────────────────────────────────────────────────────────────────
groups:
  # ─── Distillation pipeline ─────────────────────────────────────────────────
  - name: pcmi_distillation
    interval: 30s
    rules:
      - alert: PCMIDistillationErrorsBurst
        expr: sum(rate(pcmi_distillation_total{status="error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: pcmi-worker
        annotations:
          summary: "Distillation jobs are failing"
          description: |
            More than 0 distillation jobs/sec have status=error for 5 minutes.
            Check worker logs for OpenAI 429 / JSON parse errors.
            Current rate: {{ $value | humanize }} errors/sec.

      - alert: PCMIDistillationErrorsCritical
        expr: sum(rate(pcmi_distillation_total{status="error"}[5m])) > 1
        for: 5m
        labels:
          severity: critical
          service: pcmi-worker
        annotations:
          summary: "Distillation error rate is critically high"
          description: |
            Sustained >1 distillation error/sec for 5 minutes.
            Pipeline is degraded — investigate immediately.

      - alert: PCMIDistillationQueueBacklog
        expr: pcmi_distillation_queued_jobs > 50
        for: 10m
        labels:
          severity: warning
          service: pcmi-worker
        annotations:
          summary: "Distillation queue is backing up"
          description: |
            >50 distillation jobs queued for 10 minutes — DISTILLATION_CONCURRENCY
            may be too low for current load, or OpenAI is slow.
            Currently queued: {{ $value }}.

      - alert: PCMIDistillationLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(pcmi_distillation_duration_seconds_bucket[5m]))
          ) > 30
        for: 10m
        labels:
          severity: warning
          service: pcmi-worker
        annotations:
          summary: "Distillation p95 latency > 30s"
          description: |
            p95 distillation job duration exceeded 30s for 10 minutes.
            OpenAI may be throttling or the prompt has grown.

  # ─── Worker liveness ───────────────────────────────────────────────────────
  - name: pcmi_worker
    interval: 30s
    rules:
      - alert: PCMIWorkerNoEvents
        # No Redis events consumed at all for 15 minutes while the worker is up.
        # Suggests the worker is alive but pub/sub is broken or no producers.
        expr: sum(rate(pcmi_worker_redis_events_total[15m])) == 0
        for: 15m
        labels:
          severity: warning
          service: pcmi-worker
        annotations:
          summary: "Worker consumed no Redis events for 15 minutes"
          description: |
            Worker process is exporting metrics but
            sum(rate(pcmi_worker_redis_events_total[15m])) == 0.
            Check that the API is publishing and that the worker is subscribed
            to the memory_events channel.

  # ─── API ────────────────────────────────────────────────────────────────────
  - name: pcmi_api
    interval: 30s
    rules:
      - alert: PCMIAPINoStores
        # No memory stores for 30 minutes (during business hours this is unusual).
        # Acts as a "is the API actually used?" liveness check.
        expr: sum(rate(pcmi_memory_stores_total[30m])) == 0
        for: 30m
        labels:
          severity: info
          service: pcmi-api
        annotations:
          summary: "No memory store operations for 30 minutes"
          description: |
            pcmi_memory_stores_total has not increased for 30 minutes.
            Could be normal at low-traffic hours, but worth checking.

  # ─── Webhook dead-letter ────────────────────────────────────────────────────
  - name: pcmi_webhooks
    interval: 60s
    rules:
      - alert: PCMIWebhookDeadLetterAccumulating
        expr: |
          increase(pcmi_webhook_dead_letter_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: pcmi-worker
        annotations:
          summary: "Webhook deliveries entering dead-letter queue"
          description: |
            {{ $value }} webhook deliveries have entered dead-letter status
            in the last 15 minutes. Check webhook endpoint availability
            and review /v1/webhooks/dead-letter for details.

      - alert: PCMIWebhookDeadLetterHigh
        expr: |
          increase(pcmi_webhook_dead_letter_total[1h]) > 10
        for: 0m
        labels:
          severity: critical
          service: pcmi-worker
        annotations:
          summary: "High webhook dead-letter rate"
          description: |
            >10 webhook deliveries failed all retry attempts in the last hour.
            Tenant integrations may be silently broken.

      - alert: PCMIWebhookQueueOld
        expr: |
          pcmi_webhook_pending_oldest_age_seconds > 1800
        for: 5m
        labels:
          severity: warning
          service: pcmi-worker
        annotations:
          summary: "Webhook has been pending for >30 min"
          description: |
            A webhook delivery has been in 'pending' state for over 30 minutes.
            Worker may be stuck or the endpoint is consistently unreachable.

  # ─── SLOs ───────────────────────────────────────────────────────────────────
  - name: pcmi_slos
    interval: 30s
    rules:
      - alert: PCMISLOStorep99High
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(pcmi_http_request_duration_seconds_bucket{handler="store"}[5m]))
          ) > 0.045
        for: 5m
        labels:
          severity: warning
          service: pcmi-api
          slo: store_latency_p99
        annotations:
          summary: "Store P99 latency approaching SLO breach (>45ms)"
          description: |
            P99 store latency has exceeded 45ms for 5 minutes.
            SLO threshold is 50ms — 5ms headroom remaining.
            Current P99: {{ $value | humanizeDuration }}.
            Runbook: docs/runbooks/store-latency.md

      - alert: PCMISLORetrievep99High
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(pcmi_http_request_duration_seconds_bucket{handler="retrieve"}[5m]))
          ) > 0.090
        for: 5m
        labels:
          severity: warning
          service: pcmi-api
          slo: retrieve_latency_p99
        annotations:
          summary: "Retrieve P99 latency approaching SLO breach (>90ms)"
          description: |
            P99 retrieve latency has exceeded 90ms for 5 minutes.
            SLO threshold is 100ms — 10ms headroom remaining.
            Current P99: {{ $value | humanizeDuration }}.
            Runbook: docs/runbooks/retrieve-latency.md

      - alert: PCMISLODistillationLag
        expr: pcmi_distillation_queued_jobs > 50
        for: 5m
        labels:
          severity: warning
          service: pcmi-worker
          slo: distillation_lag
        annotations:
          summary: "Distillation queue depth exceeds SLO threshold"
          description: |
            >50 distillation jobs have been queued for 5 minutes.
            SLO requires 95% of memory.stored events to produce a result within 60s.
            Currently queued: {{ $value }}.
            Runbook: docs/runbooks/distillation-lag.md
