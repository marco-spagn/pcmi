# Graph stack override: point API + worker at postgres-age and enable entity demo flags.
# These literals override .env (which often has EXTRACTION_ENABLED=false).
services:
  api:
    environment:
      DATABASE_URL: postgres://pcmi:pcmi@postgres-age:5432/pcmi
      RATE_LIMIT_DISABLED: "${RATE_LIMIT_DISABLED:-true}"
      EXTRACTION_ENABLED: "true"
      LINK_PROPOSALS_ENABLED: "true"
      ENTITY_ALIAS_PROPOSALS_ENABLED: "true"
    depends_on:
      postgres-age:
        condition: service_healthy
  worker:
    environment:
      DATABASE_URL: postgres://pcmi:pcmi@postgres-age:5432/pcmi
      EXTRACTION_ENABLED: "true"
      LINK_PROPOSALS_ENABLED: "true"
      ENTITY_ALIAS_PROPOSALS_ENABLED: "true"
    depends_on:
      postgres-age:
        condition: service_healthy
