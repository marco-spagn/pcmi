services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pcmi-postgres
    environment:
      POSTGRES_DB: pcmi
      POSTGRES_USER: pcmi
      POSTGRES_PASSWORD: pcmi
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcmi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: pcmi-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://pcmi:pcmi@postgres:5432/pcmi
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://pcmi:pcmi@postgres:5432/pcmi
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    command: ["./pcmi-worker"]   

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5  

volumes:
  postgres_data: