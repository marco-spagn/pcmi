openapi: 3.0.3
info:
  title: PCMI API
  description: Persistent Cognitive Memory Infrastructure — memory API (v1)
  version: 1.51.0
servers:
  - url: http://localhost:8000
    description: Local
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Liveness (no auth)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  version: { type: string }
  /v1/health:
    get:
      summary: Version probe (no auth)
      security: []
      responses:
        "200":
          description: OK
  /ready:
    get:
      summary: Readiness (PostgreSQL + Redis; no auth)
      security: []
      responses:
        "200":
          description: Dependencies reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database or Redis not reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /v1/ready:
    get:
      summary: Readiness alias (same as /ready)
      security: []
      responses:
        "200":
          description: Dependencies reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database or Redis not reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /v1/sessions:
    post:
      summary: Start an agent session (working memory scope)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
  /v1/sessions/{id}:
    delete:
      summary: End session (sets ended_at)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "404":
          description: Not found
  /v1/sessions/{id}/memories:
    post:
      summary: Store working memory scoped to session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionStoreMemoryRequest"
      responses:
        "200":
          description: Stored
        "404":
          description: Session not found
        "409":
          description: Session ended
    get:
      summary: List session working memories (optional long-term tail)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: path_prefix
          in: query
          schema: { type: string, example: root }
        - name: include_long_term
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Memories (session rows first when include_long_term=true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMemoriesResponse"
  /v1/sessions/{id}/promote:
    post:
      summary: Promote session working memory to long-term paths
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteSessionRequest"
      responses:
        "200":
          description: Promotion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoteSessionResponse"
  /v1/memories/history:
    get:
      summary: Historical reconstruction — all versions for a path
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, example: root.domain.topic }
        - $ref: "#/components/parameters/ListLimit50"
        - $ref: "#/components/parameters/ListCursor"
        - $ref: "#/components/parameters/ListAfterID"
      responses:
        "200":
          description: Version history newest-first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          description: Missing path
  /metrics:
    get:
      summary: Prometheus metrics (no auth)
      security: []
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
  /v1/memories/batch:
    post:
      summary: Batch store up to 50 memories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/StoreMemoryRequest"
      responses:
        "200":
          description: Per-item results
  /v1/retrieve/batch:
    post:
      summary: Batch retrieve up to 20 queries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queries]
              properties:
                queries:
                  type: array
                  maxItems: 20
                  items:
                    $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: Parallel retrieve results
  /v1/memories/export:
    post:
      summary: Export current memories under path_prefix as JSON
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path_prefix: { type: string }
                limit: { type: integer, default: 500 }
                include_embeddings: { type: boolean, default: false }
      responses:
        "200":
          description: Export bundle
  /v1/memories/import:
    post:
      summary: Import memories (skip or overwrite existing paths)
      description: >
        Imports up to 1000 entries per request. Larger datasets must be split
        across multiple calls; exceeding the limit returns 400.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [skip, overwrite], default: skip }
                entries:
                  type: array
                  maxItems: 1000
                  items:
                    $ref: "#/components/schemas/StoreMemoryRequest"
      responses:
        "200":
          description: Import results
        "400":
          description: Too many entries (max 1000) or invalid request
  /v1/memories/{path}:
    get:
      summary: Get a single memory by path (optional version or as_of)
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          schema: { type: integer }
        - name: as_of
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
        "404":
          description: Not found
  /v1/admin/ui:
    get:
      summary: Embedded admin dashboard (HTML)
      description: |
        Serves the bundled admin HTML shell (no API key on page load).
        In the browser, pass an admin key via `?key=` or the prompt; API calls use `X-API-Key`.
      responses:
        "200":
          description: HTML dashboard
          content:
            text/html:
              schema:
                type: string
  /v1/admin/tenants:
    get:
      summary: List tenants (admin role)
      parameters:
        - $ref: "#/components/parameters/ListLimit100"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Tenant list (keyset pagination; after_id not supported)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantsListResponse"
    post:
      summary: Create tenant (admin role)
      responses:
        "201":
          description: Created
  /v1/admin/api-keys:
    get:
      summary: List API keys for tenant
      parameters:
        - name: tenant_id
          in: query
          schema: { type: string, format: uuid }
          description: Filter keys for tenant (defaults to caller tenant)
        - $ref: "#/components/parameters/ListLimit50"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: API key list (keyset pagination; after_id not supported)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAPIKeysListResponse"
    post:
      summary: Create API key (returns plaintext key once)
  /v1/admin/api-keys/{id}:
    delete:
      summary: Revoke API key immediately (sets is_active=false)
      responses:
        "204":
          description: Revoked
        "404":
          description: Key not found
  /v1/admin/api-keys/{id}/rotate:
    post:
      summary: Rotate API key (new row + 24h grace on previous hash; returns new plaintext key once)
  /v1/memories:
    post:
      summary: Store a memory entry (append-only; supersedes same path)
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: false
          schema:
            type: string
            format: uuid
          description: Optional UUID; duplicate requests within 24h return the cached 200 body with X-Idempotency-Replayed true
        - in: header
          name: X-Dedup-Mode
          required: false
          schema:
            type: string
            enum: [none, skip, link, merge]
          description: Overrides tenant/env dedup for this ingest (see DEDUP_MODE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreMemoryRequest"
      responses:
        "200":
          description: Stored
          headers:
            X-Idempotency-Replayed:
              schema:
                type: string
              description: "true when the response was served from the idempotency cache"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  status: { type: string, description: stored or deduplicated }
                  dedup_action: { type: string, enum: [skipped, linked, merged], description: Present when ingest deduplicated }
                  linked_from: { type: string, description: Request path linked to canonical entry (link mode) }
                  version: { type: integer }
                  superseded_id: { type: integer, format: int64, description: Present when a prior version was closed }
  /v1/memories/{path}/importance:
    patch:
      summary: Update importance on the current memory version at path
      parameters:
        - in: path
          name: path
          required: true
          schema: { type: string }
          description: ltree path (e.g. root.domain.topic)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateImportanceRequest"
      responses:
        "200":
          description: Importance updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  importance: { type: number }
                  status: { type: string }
        "404":
          description: Path not found
  /v1/memories/rollback:
    post:
      summary: Roll back a path to a prior version (append-only; creates new version)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "200":
          description: Rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackResponse"
        "404":
          description: Historical version not found
  /v1/memories/compact:
    post:
      summary: Compact superseded rows for one path (keep newest N closed versions; current row untouched)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompactMemoryRequest"
      responses:
        "200":
          description: Compaction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactMemoryResponse"
  /v1/retrieve:
    post:
      summary: Hybrid retrieve (structural + optional semantic + temporal filter)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: Result set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveResponse"
  /v1/events/schemas:
    get:
      summary: List registered event type schemas for payload validation
      responses:
        "200":
          description: Schema registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventSchema"
                  total: { type: integer }
  /v1/memories/summarize:
    post:
      summary: Summarize memories under a path prefix (extractive or LLM when OpenAI configured)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummarizeRequest"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummarizeResponse"
  /v1/webhooks/dead-letter:
    get:
      summary: List webhook deliveries that exhausted retries
      parameters:
        - $ref: "#/components/parameters/ListLimit50"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Dead-letter queue entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeadLetterListResponse"
  /v1/events:
    post:
      summary: Ingest a universal runtime event (validated against schema registry when strict)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventRequest"
      responses:
        "200":
          description: Event persisted and published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventResponse"
        "400":
          description: Invalid request
    get:
      summary: Stream PCMI events (Server-Sent Events)
      parameters:
        - name: types
          in: query
          required: false
          schema:
            type: string
            example: memory.stored,memory.updated,knowledge.distilled
          description: Comma-separated event types; omit for all types visible to the tenant
      responses:
        "200":
          description: >-
            text/event-stream of JSON events (objects with type + payload fields).
          content:
            text/event-stream:
              schema:
                type: string
  /v1/distilled:
    get:
      summary: List distilled knowledge under an ltree prefix
      parameters:
        - name: path_prefix
          in: query
          required: true
          schema: { type: string, example: root.test }
        - $ref: "#/components/parameters/ListLimit50"
        - $ref: "#/components/parameters/ListCursor"
        - $ref: "#/components/parameters/ListAfterID"
      responses:
        "200":
          description: Distilled entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistilledListResponse"
  /v1/distillation/policies:
    get:
      summary: List distillation policies for the tenant
      parameters:
        - $ref: "#/components/parameters/ListLimit50"
        - $ref: "#/components/parameters/ListCursor"
        - $ref: "#/components/parameters/ListAfterID"
      responses:
        "200":
          description: Policy list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistillationPoliciesListResponse"
    post:
      summary: Create a distillation policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDistillationPolicyRequest"
      responses:
        "201":
          description: Created
  /v1/distillation/policies/{id}:
    patch:
      summary: Update a distillation policy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
  /v1/distillation/runs:
    get:
      summary: List distillation runs (optional policy_id filter)
      parameters:
        - name: policy_id
          in: query
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/ListLimit50"
        - $ref: "#/components/parameters/ListCursor"
        - $ref: "#/components/parameters/ListAfterID"
      responses:
        "200":
          description: Run history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistillationRunsListResponse"
  /v1/audit:
    get:
      summary: List API audit log entries for the authenticated tenant
      parameters:
        - $ref: "#/components/parameters/ListLimit50"
        - $ref: "#/components/parameters/ListCursor"
        - $ref: "#/components/parameters/ListAfterID"
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339 lower bound on created_at
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
  /v1/memories/refine:
    post:
      summary: Queue an asynchronous distillation-refine job for a path prefix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineRequest"
      responses:
        "200":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefineResponse"
        "400":
          description: Invalid request
        "503":
          description: Event bus unavailable
  /v1/extraction-profiles:
    get:
      summary: List tenant extraction profiles (Phase A entity layer)
      description: |
        Returns domain profiles that drive LLM attribute slot extraction into
        `metadata.pcmi_extract`. See [cognitive-graph-entities.md](cognitive-graph-entities.md).
      responses:
        "200":
          description: Profile list
    put:
      summary: Upsert extraction profile (not supported at collection path)
      responses:
        "405":
          description: Use PUT /v1/extraction-profiles/{profile_id}
  /v1/extraction-profiles/{profile_id}:
    put:
      summary: Create or update a tenant extraction profile
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                path_prefix: { type: string, default: root }
                enabled: { type: boolean, default: true }
                profile:
                  type: object
                  description: Domain profile JSON (required_slots, entity_promotion, …)
      responses:
        "200":
          description: Stored profile
        "400":
          description: Invalid profile
    delete:
      summary: Delete an extraction profile
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /v1/memories/extraction/{memory_id}:
    get:
      summary: Read pcmi_extract for a memory (current version)
      parameters:
        - name: memory_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Extraction record or null
        "404":
          description: Memory not found
    post:
      summary: Force LLM attribute extraction for a memory
      parameters:
        - name: memory_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Extraction completed
        "404":
          description: No memory or matching profile
        "422":
          description: LLM/validation failure (partial extraction may be returned)
        "503":
          description: EXTRACTION_ENABLED=false or LLM not configured
  /v1/graph/health:
    get:
      summary: Cognitive Graph (AGE) availability probe (experimental spike; no auth)
      description: |
        Reports whether Apache AGE and `pcmi_memory_graph` are available.
        See [cognitive-graph.md](cognitive-graph.md).
      security: []
      responses:
        "200":
          description: Extension status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphHealthResponse"
  /v1/graph/related:
    get:
      summary: Traverse memory links via AGE (experimental spike)
      description: |
        Returns memories reachable within `depth` hops from `memory_id`.
        Requires AGE; returns 501 when unavailable. See [cognitive-graph.md](cognitive-graph.md).
      parameters:
        - name: memory_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 3 }
        - name: link_types
          in: query
          schema: { type: string }
          description: Comma-separated link types (causal, temporal, contradicts, supports, related)
        - name: direction
          in: query
          schema: { type: string, enum: [both, out, in], default: both }
          description: Traversal direction — both follows edges in either direction; out is legacy outgoing-only
        - name: cursor
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
          description: Keyset pagination cursor (last memory ID from previous page)
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Related memories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphRelatedResponse"
        "400":
          description: Invalid query
        "501":
          description: AGE not installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphUnavailableResponse"
  /v1/graph/chain:
    get:
      summary: Find shortest causal chain between two memories (experimental spike)
      description: |
        Finds the shortest path between two memories using the given link types.
        Requires AGE; returns 501 when unavailable. See [cognitive-graph.md](cognitive-graph.md).
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: Source memory ID
        - name: to
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: Target memory ID
        - name: link_types
          in: query
          schema: { type: string }
          description: Comma-separated link types (causal, temporal, contradicts, supports, related)
        - name: max_depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: Chain result (connected or not)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphChainResponse"
        "400":
          description: Invalid query
        "501":
          description: AGE not installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphUnavailableResponse"
  /v1/graph/entities/memory:
    get:
      summary: List entity vertices mentioned by a memory (Phase B)
      description: |
        Returns promoted `:Entity` vertices linked from the memory via `:mentions`.
        Requires AGE and prior successful extraction with `entity_promotion` rules.
        Returns 501 when AGE is unavailable. See [cognitive-graph-entities.md](cognitive-graph-entities.md).
      parameters:
        - name: memory_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Entity mentions for the memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphEntitiesForMemoryResponse"
        "400":
          description: Invalid query
        "501":
          description: AGE not installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphUnavailableResponse"
  /v1/graph/entities/related:
    get:
      summary: Correlate memories via shared entity vertices (Phase B)
      description: |
        Returns memories that mention the same entity (`kind` + `key`) or, when
        `memory_id` is given, other memories sharing any promoted entity with that memory.
        Requires AGE. Returns 501 when unavailable.
      parameters:
        - name: kind
          in: query
          schema: { type: string }
          description: Entity kind (e.g. IPAddress) — required with key unless memory_id is set
        - name: key
          in: query
          schema: { type: string }
          description: Normalized entity key — required with kind unless memory_id is set
        - name: memory_id
          in: query
          schema: { type: integer, format: int64 }
          description: Find memories sharing entities with this memory
        - name: cursor
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Correlated memories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphEntitiesRelatedResponse"
        "400":
          description: Invalid query
        "501":
          description: AGE not installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphUnavailableResponse"
  /v1/graph/link-proposals:
    get:
      summary: List LLM link proposals (Phase C review queue)
      description: |
        Returns pending, accepted, or rejected link proposals. Accepting a proposal
        creates a row in memory_links. Requires `LINK_PROPOSALS_ENABLED=true` for generation.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, rejected], default: pending }
        - name: source_memory_id
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Proposal list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkProposalListResponse"
        "400":
          description: Invalid query
  /v1/graph/link-proposals/generate/{memory_id}:
    post:
      summary: Generate LLM link proposals for a memory (Phase C)
      description: |
        Runs the LLM proposal pipeline against entity-correlated candidate memories.
        Requires write role, successful extraction, AGE, and `LINK_PROPOSALS_ENABLED=true`.
      parameters:
        - name: memory_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Newly stored pending proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkProposalGenerateResponse"
        "404":
          description: Memory not found
        "422":
          description: Extraction/profile prerequisite missing
        "503":
          description: Proposals disabled or graph/LLM unavailable
  /v1/graph/link-proposals/{id}/accept:
    post:
      summary: Accept a pending link proposal (materialize to memory_links)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Link created and proposal marked accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkProposalAcceptResponse"
        "404":
          description: Proposal not found
        "409":
          description: Proposal not pending
  /v1/graph/link-proposals/{id}/reject:
    post:
      summary: Reject a pending link proposal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Proposal marked rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkProposalRejectResponse"
        "404":
          description: Proposal not found
        "409":
          description: Proposal not pending
  /v1/graph/cypher:
    post:
      summary: Execute a read-only Cypher query (experimental spike; requires write role)
      description: |
        Passthrough for raw Cypher read queries against pcmi_memory_graph.
        Only MATCH queries are allowed. Tenant scoping is the caller's responsibility.
        Requires write role. See [cognitive-graph.md](cognitive-graph.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CypherQueryRequest"
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CypherQueryResponse"
        "400":
          description: Invalid query or query rejected
        "403":
          description: Read-only role cannot execute Cypher
        "501":
          description: AGE not installed
  /v1/memories/links:
    post:
      summary: Create a typed link between two memory paths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryLink"
        "400":
          description: Invalid request
    get:
      summary: List memory links (filterable by from_path, to_path, link_type)
      parameters:
        - name: from_path
          in: query
          schema: { type: string }
        - name: to_path
          in: query
          schema: { type: string }
        - name: link_type
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/ListLimit50"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Paged link list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryLinksListResponse"
  /v1/lineage/memory:
    get:
      summary: Version history and derived distillations for a memory path
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: ltree path of the memory entry
      responses:
        "200":
          description: Memory lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryLineageResponse"
        "404":
          description: Path not found
  /v1/lineage/distilled/{id}:
    get:
      summary: Source memories that contributed to a distilled knowledge entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Distilled lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistilledLineageResponse"
        "404":
          description: Not found
  /v1/webhooks:
    post:
      summary: Register a new webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWebhookRequest"
      responses:
        "201":
          description: Webhook registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterWebhookResponse"
        "400":
          description: Invalid request
    get:
      summary: List registered webhook endpoints for the authenticated tenant
      parameters:
        - $ref: "#/components/parameters/ListLimit50"
        - $ref: "#/components/parameters/ListCursor"
      responses:
        "200":
          description: Webhook endpoint list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointListResponse"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    ListLimit50:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      description: Page size (server clamps to 1–200)
    ListLimit100:
      name: limit
      in: query
      schema: { type: integer, default: 100, minimum: 1, maximum: 200 }
      description: Page size (server clamps to 1–200)
    ListCursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque keyset continuation from a prior response `next_cursor` (mutually exclusive with `after_id`)
    ListAfterID:
      name: after_id
      in: query
      schema: { type: integer, format: int64, minimum: 1 }
      description: Legacy alias that builds a cursor when `cursor` is absent (not supported on admin tenant/key or webhook lists)
  schemas:
    PaginatedListMeta:
      type: object
      properties:
        limit: { type: integer }
        next_cursor:
          type: string
          description: Empty when there is no further page; pass as `cursor` on the next request
        has_more: { type: boolean }
    ReadyResponse:
      type: object
      properties:
        status: { type: string, description: ready or not_ready }
        database_ok: { type: boolean }
        redis_ok: { type: boolean }
        service: { type: string }
        version: { type: string }
    StoreMemoryRequest:
      type: object
      required: [path, content]
      properties:
        path: { type: string, description: ltree path e.g. root.domain.topic }
        content: { type: string }
        metadata: { type: object, additionalProperties: true }
        tags:
          type: array
          items: { type: string }
        embedding:
          type: array
          items: { type: number, format: float }
        embedding_model: { type: string }
        embedding_space: { type: string, default: default, description: Logical embedding space for multi-model migrations }
        source_agent_id: { type: string, format: uuid }
        importance:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: Retrieval boost weight in [0,1]
        dedup_mode:
          type: string
          enum: [none, skip, link, merge]
          description: Per-request dedup override (env DEDUP_MODE and tenants.settings.dedup_mode otherwise)
    RetrieveRequest:
      type: object
      properties:
        path_prefix: { type: string }
        query: { type: string, description: Text filter and/or semantic query when OPENAI_API_KEY is set on API }
        limit: { type: integer, default: 10 }
        as_of: { type: string, format: date-time, nullable: true }
        source_agent_id: { type: string, format: uuid, description: Cross-agent scope filter }
        embedding_space: { type: string, description: Filter by embedding space label }
        decay_enabled:
          type: boolean
          default: true
          description: When false, temporal recency decay is omitted from hybrid scoring
    UpdateImportanceRequest:
      type: object
      required: [importance]
      properties:
        importance:
          type: number
          minimum: 0
          maximum: 1
    MemoryEntry:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: string, format: uuid }
        path: { type: string }
        content: { type: string }
        metadata: { type: object }
        tags:
          type: array
          items: { type: string }
        embedding_model: { type: string }
        embedding_space: { type: string }
        version: { type: integer }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time, nullable: true }
        relevance_score: { type: number, description: Fused hybrid score when query/embedding ranking is used }
        importance: { type: number, minimum: 0, maximum: 1 }
        access_count: { type: integer }
        last_accessed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    RetrieveResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/MemoryEntry" }
        total: { type: integer }
    RollbackRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
        version: { type: integer, description: Exact version to restore (mutually exclusive with as_of) }
        as_of: { type: string, format: date-time, description: Point-in-time slice (mutually exclusive with version) }
    RollbackResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        version: { type: integer }
        restored_from_version: { type: integer }
        superseded_id: { type: integer, format: int64 }
    CompactMemoryRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: ltree path }
        keep_superseded:
          type: integer
          default: 20
          minimum: 1
          maximum: 500
          description: Number of newest superseded (closed) versions to retain
    CompactMemoryResponse:
      type: object
      properties:
        path: { type: string }
        deleted_count: { type: integer }
        keep_superseded: { type: integer }
    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: string, format: uuid }
        api_key_id: { type: string, format: uuid }
        event_type: { type: string }
        path: { type: string }
        method: { type: string }
        status_code: { type: integer }
        ip_address: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
    AuditListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginatedListMeta"
        - type: object
          properties:
            entries:
              type: array
              items: { $ref: "#/components/schemas/AuditEntry" }
            total:
              type: integer
              description: Total rows matching the filter (not just the current page)
            offset:
              type: integer
              description: Deprecated; always 0 (offset pagination removed)
    HistoryResponse:
      type: object
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/MemoryEntry" }
        total:
          type: integer
          description: Number of entries in this page (not total versions for the path)
        limit: { type: integer }
        next_cursor: { type: string }
        has_more: { type: boolean }
    DistilledListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginatedListMeta"
        - type: object
          properties:
            entries:
              type: array
              items: { type: object }
            total:
              type: integer
              description: Number of entries in this page
            tenant: { type: string, format: uuid }
    DistillationPoliciesListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginatedListMeta"
        - type: object
          properties:
            policies:
              type: array
              items: { type: object }
    DistillationRunsListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginatedListMeta"
        - type: object
          properties:
            runs:
              type: array
              items: { type: object }
    WebhookDeadLetterListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginatedListMeta"
        - type: object
          properties:
            entries:
              type: array
              items: { type: object }
    AdminTenantsListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginatedListMeta"
        - type: object
          properties:
            tenants:
              type: array
              items: { type: object }
            total:
              type: integer
              description: Total tenants in the system (not just this page)
    AdminAPIKeysListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginatedListMeta"
        - type: object
          properties:
            api_keys:
              type: array
              items: { type: object }
    IngestEventRequest:
      type: object
      required: [event_type]
      properties:
        event_type: { type: string, example: agent.step.completed }
        agent_id: { type: string, format: uuid }
        correlation_id: { type: string }
        payload: { type: object, additionalProperties: true }
    IngestEventResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        timestamp: { type: string, format: date-time }
        status: { type: string }
    EventSchema:
      type: object
      properties:
        event_type: { type: string }
        description: { type: string }
        strict: { type: boolean }
        fields:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              required: { type: boolean }
              description: { type: string }
    SummarizeRequest:
      type: object
      properties:
        path_prefix: { type: string, example: root.domain }
        limit: { type: integer, default: 20, maximum: 100 }
        style: { type: string, enum: [brief, detailed], default: brief }
    SummarizeResponse:
      type: object
      properties:
        path_prefix: { type: string }
        summary: { type: string }
        source_ids:
          type: array
          items: { type: integer, format: int64 }
        method: { type: string, enum: [extractive, llm, none] }
        total: { type: integer }
    CreateSessionRequest:
      type: object
      properties:
        agent_id: { type: string, format: uuid }
        metadata: { type: object, additionalProperties: true }
    AgentSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid, nullable: true }
        metadata: { type: object, additionalProperties: true }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [active, ended] }
    SessionStoreMemoryRequest:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
        metadata: { type: object, additionalProperties: true }
        tags: { type: array, items: { type: string } }
        embedding_model: { type: string }
        source_agent_id: { type: string, format: uuid }
        importance: { type: number, minimum: 0, maximum: 1 }
    SessionMemoriesResponse:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        entries:
          type: array
          items: { $ref: "#/components/schemas/MemoryEntry" }
        total: { type: integer }
    PromoteSessionRequest:
      type: object
      properties:
        target_prefix: { type: string, default: root, example: root }
    PromoteSessionResponse:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        promoted: { type: integer }
        skipped: { type: integer, description: "Items not promoted because the target path already held a current memory" }
        target_prefix: { type: string }
        status: { type: string }
    CreateDistillationPolicyRequest:
      type: object
      required: [name, path_prefix]
      properties:
        name: { type: string }
        path_prefix: { type: string }
        enabled: { type: boolean, default: true }
        count_threshold: { type: integer, minimum: 1, default: 10 }
        min_interval_secs: { type: integer, minimum: 0, default: 300 }
        max_age_secs: { type: integer, nullable: true }
    RefineRequest:
      type: object
      required: [path_prefix]
      properties:
        path_prefix: { type: string, description: ltree path prefix to distill }
    RefineResponse:
      type: object
      properties:
        status: { type: string, enum: [queued] }
        path_prefix: { type: string }
    GraphHealthResponse:
      type: object
      properties:
        available: { type: boolean }
        extension: { type: string, example: apache-age }
    GraphRelatedEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        link_type: { type: string }
        depth: { type: integer }
    GraphRelatedResponse:
      type: object
      properties:
        memory_id: { type: integer, format: int64 }
        depth: { type: integer }
        direction: { type: string, enum: [both, out, in] }
        count: { type: integer }
        total: { type: integer, description: Total matching entries before pagination }
        next_cursor: { type: integer, format: int64 }
        limit: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/GraphRelatedEntry" }
    GraphUnavailableResponse:
      type: object
      properties:
        error: { type: string }
        hint: { type: string }
    GraphChainLink:
      type: object
      properties:
        from_id: { type: integer, format: int64 }
        to_id: { type: integer, format: int64 }
        link_type: { type: string }
        hop: { type: integer }
    GraphChainResponse:
      type: object
      properties:
        from_id: { type: integer, format: int64 }
        to_id: { type: integer, format: int64 }
        connected: { type: boolean }
        hops: { type: integer }
        path:
          type: array
          items: { $ref: "#/components/schemas/GraphChainLink" }
    GraphEntityMention:
      type: object
      properties:
        slot: { type: string }
        kind: { type: string }
        key: { type: string }
        confidence: { type: number, format: float }
    GraphEntitiesForMemoryResponse:
      type: object
      properties:
        memory_id: { type: integer, format: int64 }
        count: { type: integer }
        entities:
          type: array
          items: { $ref: "#/components/schemas/GraphEntityMention" }
    GraphEntityRelatedEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        shared_kind: { type: string }
        shared_key: { type: string }
        slot: { type: string }
        confidence: { type: number, format: float }
    GraphEntitiesRelatedResponse:
      type: object
      properties:
        kind: { type: string }
        key: { type: string }
        memory_id: { type: string }
        count: { type: integer }
        total: { type: integer }
        next_cursor: { type: integer, format: int64 }
        limit: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/GraphEntityRelatedEntry" }
    LinkProposal:
      type: object
      properties:
        id: { type: integer, format: int64 }
        source_memory_id: { type: integer, format: int64 }
        from_memory_id: { type: integer, format: int64 }
        to_memory_id: { type: integer, format: int64 }
        from_path: { type: string }
        to_path: { type: string }
        link_type: { type: string }
        status: { type: string, enum: [pending, accepted, rejected] }
        confidence: { type: number, format: float }
        reason: { type: string }
        profile_id: { type: string }
        model: { type: string }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
    LinkProposalListResponse:
      type: object
      properties:
        status: { type: string }
        count: { type: integer }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/LinkProposal" }
    LinkProposalGenerateResponse:
      type: object
      properties:
        source_memory_id: { type: integer, format: int64 }
        count: { type: integer }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/LinkProposal" }
    LinkProposalAcceptResponse:
      type: object
      properties:
        link: { $ref: "#/components/schemas/MemoryLink" }
        proposal: { $ref: "#/components/schemas/LinkProposal" }
    LinkProposalRejectResponse:
      type: object
      properties:
        proposal: { $ref: "#/components/schemas/LinkProposal" }
    CypherQueryRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, description: Read-only Cypher MATCH query }
    CypherQueryResponse:
      type: object
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    CreateLinkRequest:
      type: object
      required: [from_path, to_path]
      properties:
        from_path: { type: string }
        to_path: { type: string }
        link_type:
          type: string
          enum: [causal, temporal, contradicts, supports, related]
          default: related
          description: >-
            Relationship type. Defaults to "related" when omitted. Values outside
            this set are rejected with 400. The "duplicate" type is reserved for
            the dedup engine and is not assignable here.
        metadata: { type: object, additionalProperties: true }
    MemoryLink:
      type: object
      properties:
        id: { type: integer, format: int64 }
        from_path: { type: string }
        to_path: { type: string }
        link_type: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    MemoryLinksListResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/MemoryLink" }
        limit: { type: integer }
        next_cursor: { type: string }
        has_more: { type: boolean }
    DistilledLineageItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        path: { type: string }
        summary: { type: string }
        version: { type: integer }
        source_entry_ids:
          type: array
          items: { type: integer, format: int64 }
        confidence_score: { type: number, format: float }
    MemoryLineageResponse:
      type: object
      properties:
        entry_id: { type: integer, format: int64 }
        path: { type: string }
        versions:
          type: array
          items: { $ref: "#/components/schemas/MemoryEntry" }
        distilled:
          type: array
          items: { $ref: "#/components/schemas/DistilledLineageItem" }
    DistilledLineageResponse:
      type: object
      properties:
        distilled: { $ref: "#/components/schemas/DistilledLineageItem" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/MemoryEntry" }
    RegisterWebhookRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        event_types:
          type: array
          items: { type: string }
        secret: { type: string, description: Optional HMAC signing secret }
    RegisterWebhookResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [registered] }
    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        event_types:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    WebhookEndpointListResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/WebhookEndpoint" }
        limit: { type: integer }
        next_cursor: { type: string }
        has_more: { type: boolean }
