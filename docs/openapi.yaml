openapi: 3.0.3
info:
  title: PCMI API
  description: Persistent Cognitive Memory Infrastructure — memory API (v1)
  version: 1.29.0
servers:
  - url: http://localhost:8000
    description: Local
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Liveness (no auth)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  version: { type: string }
  /v1/health:
    get:
      summary: Version probe (no auth)
      security: []
      responses:
        "200":
          description: OK
  /ready:
    get:
      summary: Readiness (PostgreSQL + Redis; no auth)
      security: []
      responses:
        "200":
          description: Dependencies reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database or Redis not reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /v1/ready:
    get:
      summary: Readiness alias (same as /ready)
      security: []
      responses:
        "200":
          description: Dependencies reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database or Redis not reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /v1/memories/history:
    get:
      summary: Historical reconstruction — all versions for a path
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, example: root.domain.topic }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Version history newest-first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          description: Missing path
  /metrics:
    get:
      summary: Prometheus metrics (no auth)
      security: []
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
  /v1/memories/batch:
    post:
      summary: Batch store up to 50 memories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/StoreMemoryRequest"
      responses:
        "200":
          description: Per-item results
  /v1/retrieve/batch:
    post:
      summary: Batch retrieve up to 20 queries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queries]
              properties:
                queries:
                  type: array
                  maxItems: 20
                  items:
                    $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: Parallel retrieve results
  /v1/memories/export:
    post:
      summary: Export current memories under path_prefix as JSON
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path_prefix: { type: string }
                limit: { type: integer, default: 500 }
                include_embeddings: { type: boolean, default: false }
      responses:
        "200":
          description: Export bundle
  /v1/memories/import:
    post:
      summary: Import memories (skip or overwrite existing paths)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [skip, overwrite], default: skip }
                entries:
                  type: array
                  items:
                    $ref: "#/components/schemas/StoreMemoryRequest"
      responses:
        "200":
          description: Import results
  /v1/memories/{path}:
    get:
      summary: Get a single memory by path (optional version or as_of)
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          schema: { type: integer }
        - name: as_of
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
        "404":
          description: Not found
  /v1/admin/tenants:
    get:
      summary: List tenants (admin role)
      responses:
        "200":
          description: Tenant list
    post:
      summary: Create tenant (admin role)
      responses:
        "201":
          description: Created
  /v1/admin/api-keys:
    get:
      summary: List API keys for tenant
    post:
      summary: Create API key (returns plaintext key once)
  /v1/admin/api-keys/{id}/rotate:
    post:
      summary: Rotate API key hash (returns new plaintext key once)
  /v1/memories:
    post:
      summary: Store a memory entry (append-only; supersedes same path)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreMemoryRequest"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  status: { type: string }
                  version: { type: integer }
                  superseded_id: { type: integer, format: int64, description: Present when a prior version was closed }
  /v1/memories/rollback:
    post:
      summary: Roll back a path to a prior version (append-only; creates new version)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "200":
          description: Rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackResponse"
        "404":
          description: Historical version not found
  /v1/memories/compact:
    post:
      summary: Compact superseded rows for one path (keep newest N closed versions; current row untouched)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompactMemoryRequest"
      responses:
        "200":
          description: Compaction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactMemoryResponse"
  /v1/retrieve:
    post:
      summary: Hybrid retrieve (structural + optional semantic + temporal filter)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: Result set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveResponse"
  /v1/events/schemas:
    get:
      summary: List registered event type schemas for payload validation
      responses:
        "200":
          description: Schema registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventSchema"
                  total: { type: integer }
  /v1/memories/summarize:
    post:
      summary: Summarize memories under a path prefix (extractive or LLM when OpenAI configured)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummarizeRequest"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummarizeResponse"
  /v1/webhooks/dead-letter:
    get:
      summary: List webhook deliveries that exhausted retries
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Dead-letter queue entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { type: object } }
                  total: { type: integer }
  /v1/events:
    post:
      summary: Ingest a universal runtime event (validated against schema registry when strict)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventRequest"
      responses:
        "200":
          description: Event persisted and published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventResponse"
        "400":
          description: Invalid request
    get:
      summary: Stream PCMI events (Server-Sent Events)
      parameters:
        - name: types
          in: query
          required: false
          schema:
            type: string
            example: memory.stored,memory.updated,knowledge.distilled
          description: Comma-separated event types; omit for all types visible to the tenant
      responses:
        "200":
          description: text/event-stream of JSON events `{ "type": "...", "payload": { ... } }`
          content:
            text/event-stream:
              schema:
                type: string
  /v1/distilled:
    get:
      summary: List distilled knowledge under an ltree prefix
      parameters:
        - name: path_prefix
          in: query
          required: true
          schema: { type: string, example: root.test }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Distilled entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { type: object }
                  total: { type: integer }
                  tenant: { type: string, format: uuid }
  /v1/audit:
    get:
      summary: List API audit log entries for the authenticated tenant
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339 lower bound on created_at
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    ReadyResponse:
      type: object
      properties:
        status: { type: string, description: ready or not_ready }
        database_ok: { type: boolean }
        redis_ok: { type: boolean }
        service: { type: string }
        version: { type: string }
    StoreMemoryRequest:
      type: object
      required: [path, content]
      properties:
        path: { type: string, description: ltree path e.g. root.domain.topic }
        content: { type: string }
        metadata: { type: object, additionalProperties: true }
        tags:
          type: array
          items: { type: string }
        embedding:
          type: array
          items: { type: number, format: float }
        embedding_model: { type: string }
        embedding_space: { type: string, default: default, description: Logical embedding space for multi-model migrations }
        source_agent_id: { type: string, format: uuid }
    RetrieveRequest:
      type: object
      properties:
        path_prefix: { type: string }
        query: { type: string, description: Text filter and/or semantic query when OPENAI_API_KEY is set on API }
        limit: { type: integer, default: 10 }
        as_of: { type: string, format: date-time, nullable: true }
        source_agent_id: { type: string, format: uuid, description: Cross-agent scope filter }
        embedding_space: { type: string, description: Filter by embedding space label }
    MemoryEntry:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: string, format: uuid }
        path: { type: string }
        content: { type: string }
        metadata: { type: object }
        tags:
          type: array
          items: { type: string }
        embedding_model: { type: string }
        embedding_space: { type: string }
        version: { type: integer }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time, nullable: true }
        relevance_score: { type: number, description: Cosine-based score when semantic path used }
        created_at: { type: string, format: date-time }
    RetrieveResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/MemoryEntry" }
        total: { type: integer }
    RollbackRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
        version: { type: integer, description: Exact version to restore (mutually exclusive with as_of) }
        as_of: { type: string, format: date-time, description: Point-in-time slice (mutually exclusive with version) }
    RollbackResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        version: { type: integer }
        restored_from_version: { type: integer }
        superseded_id: { type: integer, format: int64 }
    CompactMemoryRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, description: ltree path }
        keep_superseded:
          type: integer
          default: 20
          minimum: 1
          maximum: 500
          description: Number of newest superseded (closed) versions to retain
    CompactMemoryResponse:
      type: object
      properties:
        path: { type: string }
        deleted_count: { type: integer }
        keep_superseded: { type: integer }
    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: string, format: uuid }
        api_key_id: { type: string, format: uuid }
        event_type: { type: string }
        path: { type: string }
        method: { type: string }
        status_code: { type: integer }
        ip_address: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
    AuditListResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    IngestEventRequest:
      type: object
      required: [event_type]
      properties:
        event_type: { type: string, example: agent.step.completed }
        agent_id: { type: string, format: uuid }
        correlation_id: { type: string }
        payload: { type: object, additionalProperties: true }
    IngestEventResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        timestamp: { type: string, format: date-time }
        status: { type: string }
    HistoryResponse:
      type: object
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/MemoryEntry" }
        total: { type: integer }
    EventSchema:
      type: object
      properties:
        event_type: { type: string }
        description: { type: string }
        strict: { type: boolean }
        fields:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              required: { type: boolean }
              description: { type: string }
    SummarizeRequest:
      type: object
      properties:
        path_prefix: { type: string, example: root.domain }
        limit: { type: integer, default: 20, maximum: 100 }
        style: { type: string, enum: [brief, detailed], default: brief }
    SummarizeResponse:
      type: object
      properties:
        path_prefix: { type: string }
        summary: { type: string }
        source_ids:
          type: array
          items: { type: integer, format: int64 }
        method: { type: string, enum: [extractive, llm, none] }
        total: { type: integer }
