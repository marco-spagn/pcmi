syntax = "proto3";

package pcmi.v1;

option go_package = "github.com/marco-spagn/pcmi/internal/grpc/pcmiv1;pcmiv1";

service MemoryService {
  rpc Store(StoreRequest) returns (StoreResponse);
  // BatchStore mirrors POST /v1/memories/batch (max 50 items; write role required; same semantics as REST).
  rpc BatchStore(BatchStoreRequest) returns (BatchStoreResponse);
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
  // BatchRetrieve runs multiple retrieve queries in one round-trip (same limits as REST: max 20 queries).
  rpc BatchRetrieve(BatchRetrieveRequest) returns (BatchRetrieveResponse);
  // RetrieveStream returns the same data as Retrieve: first message carries total count, then one message per entry.
  rpc RetrieveStream(RetrieveRequest) returns (stream RetrieveStreamMsg);
  rpc Health(HealthRequest) returns (HealthResponse);
  // Ready checks PostgreSQL and Redis (no API key); suitable for Kubernetes readiness.
  rpc Ready(ReadyRequest) returns (ReadyResponse);
  // GetMemory mirrors GET /v1/memories/{path} (optional version / as_of).
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse);
  // Compact mirrors POST /v1/memories/compact.
  rpc Compact(CompactRequest) returns (CompactResponse);

  // --- Operational parity (v1.29.0); admin + /metrics remain HTTP-only ---
  rpc Refine(RefineRequest) returns (RefineResponse);
  rpc CreateLink(CreateLinkRequest) returns (CreateLinkResponse);
  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse);
  rpc GetStats(GetStatsRequest) returns (StatsResponse);
  rpc IngestEvent(IngestEventRequest) returns (IngestEventResponse);
  rpc ListEventSchemas(ListEventSchemasRequest) returns (ListEventSchemasResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventMsg);
  rpc RegisterWebhook(RegisterWebhookRequest) returns (RegisterWebhookResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  rpc ListWebhookDeadLetter(ListWebhookDeadLetterRequest) returns (JSONResponse);
  rpc MigrateEmbeddings(MigrateEmbeddingsRequest) returns (MigrateEmbeddingsResponse);
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  rpc Summarize(SummarizeRequest) returns (SummarizeResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  rpc GetMemoryLineage(GetMemoryLineageRequest) returns (JSONResponse);
  rpc GetDistilledLineage(GetDistilledLineageRequest) returns (JSONResponse);
  rpc ListDistilled(ListDistilledRequest) returns (JSONResponse);
  rpc ListAudit(ListAuditRequest) returns (JSONResponse);
  rpc ExportMemories(ExportMemoriesRequest) returns (ExportMemoriesResponse);
  rpc ImportMemories(ImportMemoriesRequest) returns (ImportMemoriesResponse);
}

message ReadyRequest {}

message ReadyResponse {
  string status = 1; // "ready" or "not_ready"
  bool database_ok = 2;
  bool redis_ok = 3;
  string version = 4;
}

message StoreRequest {
  string path = 1;
  string content = 2;
  string metadata_json = 3;
  string api_key = 4;
  // Same semantics as REST POST /v1/memories JSON body.
  repeated string tags = 5;
  string embedding_model = 6;
  string embedding_space = 7;
  string source_agent_id = 8;
  bool encrypt_content = 9;
  // Optional TTL, RFC3339 or RFC3339Nano.
  string expires_at_rfc3339 = 10;
  // Optional client-supplied embedding vector (same as REST JSON "embedding"); dimension must match DB (1536).
  repeated float embedding = 11;
  // Optional idempotency key (same semantics as REST X-Idempotency-Key); gRPC Store does not cache yet.
  string idempotency_key = 12;
}

message StoreResponse {
  int64 id = 1;
  string status = 2;
  int32 version = 3;
  optional int64 superseded_id = 4;
}

message BatchStoreItem {
  string path = 1;
  string content = 2;
  string metadata_json = 3;
  repeated string tags = 4;
  string embedding_model = 5;
  string embedding_space = 6;
  string source_agent_id = 7;
  bool encrypt_content = 8;
  string expires_at_rfc3339 = 9;
  repeated float embedding = 10;
}

message BatchStoreRequest {
  repeated BatchStoreItem items = 1;
  string api_key = 2;
}

message BatchStoreItemResult {
  int32 index = 1;
  int64 id = 2;
  string status = 3;
  int32 version = 4;
  optional int64 superseded_id = 5;
  string error = 6;
}

message BatchStoreResponse {
  repeated BatchStoreItemResult results = 1;
  int32 total = 2;
}

message RetrieveRequest {
  string path_prefix = 1;
  string query = 2;
  int32 limit = 3;
  string api_key = 4;
  // Same semantics as REST POST /v1/retrieve JSON body.
  repeated string tags = 5;
  // "any" (default when empty) or "all".
  string tags_match = 6;
  // Optional point-in-time filter, RFC3339 or RFC3339Nano (e.g. 2006-01-02T15:04:05Z07:00).
  string as_of_rfc3339 = 7;
  string source_agent_id = 8;
  string embedding_space = 9;
}

// RetrieveEntry mirrors REST MemoryEntry in retrieve responses (v1.26.0+).
message RetrieveEntry {
  int64 id = 1;
  string path = 2;
  string content = 3;
  int32 version = 4;
  double relevance_score = 5;
  string tenant_id = 6;
  string metadata_json = 7;
  repeated string tags = 8;
  string embedding_model = 9;
  string embedding_space = 10;
  string valid_from_rfc3339 = 11;
  string valid_to_rfc3339 = 12; // empty when current row has no valid_to
  string source_agent_id = 13;
  string source_event_id = 14;
  string created_at_rfc3339 = 15;
  bool content_encrypted = 16;
  repeated float embedding = 17; // omitted when not loaded / null in DB
}

message RetrieveResponse {
  repeated RetrieveEntry entries = 1;
  int32 total = 2;
}

message BatchRetrieveQuery {
  string path_prefix = 1;
  string query = 2;
  int32 limit = 3;
  repeated string tags = 4;
  string tags_match = 5;
  string as_of_rfc3339 = 6;
  string source_agent_id = 7;
  string embedding_space = 8;
}

message BatchRetrieveRequest {
  repeated BatchRetrieveQuery queries = 1;
  string api_key = 2;
}

message BatchRetrieveResult {
  repeated RetrieveEntry entries = 1;
  int32 total = 2;
}

message BatchRetrieveResponse {
  repeated BatchRetrieveResult results = 1;
  int32 total = 2;
}

message RetrieveStreamHeader {
  int32 total = 1;
}

message RetrieveStreamMsg {
  oneof msg {
    RetrieveStreamHeader header = 1;
    RetrieveEntry entry = 2;
  }
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
}

message GetMemoryRequest {
  string path = 1;
  string api_key = 2;
  // Optional exact version; 0 means latest/current.
  int32 version = 3;
  string as_of_rfc3339 = 4;
}

message GetMemoryResponse {
  RetrieveEntry entry = 1;
}

message CompactRequest {
  string path = 1;
  string api_key = 2;
  int32 keep_superseded = 3;
}

message CompactResponse {
  string path = 1;
  int32 deleted_count = 2;
  int32 keep_superseded = 3;
}

message JSONResponse {
  string json = 1;
}

message RefineRequest {
  string path_prefix = 1;
  string api_key = 2;
}

message RefineResponse {
  string status = 1;
  string path_prefix = 2;
}

message CreateLinkRequest {
  string api_key = 1;
  string from_path = 2;
  string to_path = 3;
  string link_type = 4;
  string metadata_json = 5;
}

message MemoryLinkMsg {
  int64 id = 1;
  string from_path = 2;
  string to_path = 3;
  string link_type = 4;
  string metadata_json = 5;
  string created_at_rfc3339 = 6;
}

message CreateLinkResponse {
  MemoryLinkMsg link = 1;
}

message ListLinksRequest {
  string api_key = 1;
  string from_path = 2;
  string to_path = 3;
  string link_type = 4;
  int32 limit = 5;
}

message ListLinksResponse {
  repeated MemoryLinkMsg entries = 1;
  int32 total = 2;
}

message GetStatsRequest {
  string api_key = 1;
}

message StatsResponse {
  int32 active_memories = 1;
  int32 superseded_memories = 2;
  int32 distilled_count = 3;
  int32 links_count = 4;
  int32 events_count = 5;
  int32 expiring_soon = 6;
}

message IngestEventRequest {
  string api_key = 1;
  string event_type = 2;
  string agent_id = 3;
  string correlation_id = 4;
  string payload_json = 5;
}

message IngestEventResponse {
  string id = 1;
  string event_type = 2;
  string timestamp_rfc3339 = 3;
  string status = 4;
}

message ListEventSchemasRequest {
  string api_key = 1;
}

message EventSchemaMsg {
  string type = 1;
  string description = 2;
  string payload_json = 3;
}

message ListEventSchemasResponse {
  repeated EventSchemaMsg schemas = 1;
  int32 total = 2;
}

message StreamEventsRequest {
  string api_key = 1;
  string types = 2; // comma-separated filter (optional)
}

message StreamEventMsg {
  string type = 1;
  string payload_json = 2;
}

message RegisterWebhookRequest {
  string api_key = 1;
  string url = 2;
  repeated string event_types = 3;
  string secret = 4;
}

message RegisterWebhookResponse {
  string id = 1;
  string status = 2;
}

message ListWebhooksRequest {
  string api_key = 1;
}

message WebhookEndpointMsg {
  string id = 1;
  string url = 2;
  repeated string event_types = 3;
  bool enabled = 4;
  string created_at_rfc3339 = 5;
}

message ListWebhooksResponse {
  repeated WebhookEndpointMsg entries = 1;
  int32 total = 2;
}

message ListWebhookDeadLetterRequest {
  string api_key = 1;
  int32 limit = 2;
}

message MigrateEmbeddingsRequest {
  string api_key = 1;
  string path_prefix = 2;
  string target_model = 3;
  string embedding_space = 4;
}

message MigrateEmbeddingsResponse {
  string status = 1;
  int32 marked_count = 2;
  string path_prefix = 3;
  string target_model = 4;
  string embedding_space = 5;
}

message RollbackRequest {
  string api_key = 1;
  string path = 2;
  int32 version = 3;
  string as_of_rfc3339 = 4;
}

message RollbackResponse {
  int64 id = 1;
  string status = 2;
  int32 version = 3;
  int32 restored_from_version = 4;
  optional int64 superseded_id = 5;
}

message SummarizeRequest {
  string api_key = 1;
  string path_prefix = 2;
  int32 limit = 3;
  string style = 4;
}

message SummarizeResponse {
  string path_prefix = 1;
  string summary = 2;
  repeated int64 source_ids = 3;
  string method = 4;
  int32 total = 5;
}

message GetHistoryRequest {
  string api_key = 1;
  string path = 2;
  int32 limit = 3;
}

message GetHistoryResponse {
  string path = 1;
  repeated RetrieveEntry entries = 2;
  int32 total = 3;
}

message GetMemoryLineageRequest {
  string api_key = 1;
  string path = 2;
}

message GetDistilledLineageRequest {
  string api_key = 1;
  int64 distilled_id = 2;
}

message ListDistilledRequest {
  string api_key = 1;
  string path_prefix = 2;
  int32 limit = 3;
}

message ListAuditRequest {
  string api_key = 1;
  int32 limit = 2;
  int32 offset = 3;
  string since_rfc3339 = 4;
}

message ExportMemoriesRequest {
  string api_key = 1;
  string path_prefix = 2;
  int32 limit = 3;
  bool include_embeddings = 4;
}

message ExportMemoriesResponse {
  string tenant_id = 1;
  int32 exported = 2;
  repeated RetrieveEntry entries = 3;
  string exported_at_rfc3339 = 4;
}

message ImportMemoriesRequest {
  string api_key = 1;
  repeated BatchStoreItem items = 2;
  string mode = 3;
}

message ImportMemoriesResponse {
  int32 imported = 1;
  int32 skipped = 2;
  repeated BatchStoreItemResult results = 3;
}
