syntax = "proto3";

package pcmi.v1;

option go_package = "github.com/marco-spagn/pcmi/internal/grpc/pcmiv1;pcmiv1";

service MemoryService {
  rpc Store(StoreRequest) returns (StoreResponse);
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
  // BatchRetrieve runs multiple retrieve queries in one round-trip (same limits as REST: max 20 queries).
  rpc BatchRetrieve(BatchRetrieveRequest) returns (BatchRetrieveResponse);
  // RetrieveStream returns the same data as Retrieve: first message carries total count, then one message per entry.
  rpc RetrieveStream(RetrieveRequest) returns (stream RetrieveStreamMsg);
  rpc Health(HealthRequest) returns (HealthResponse);
  // Ready checks PostgreSQL and Redis (no API key); suitable for Kubernetes readiness.
  rpc Ready(ReadyRequest) returns (ReadyResponse);
}

message ReadyRequest {}

message ReadyResponse {
  string status = 1; // "ready" or "not_ready"
  bool database_ok = 2;
  bool redis_ok = 3;
  string version = 4;
}

message StoreRequest {
  string path = 1;
  string content = 2;
  string metadata_json = 3;
  string api_key = 4;
}

message StoreResponse {
  int64 id = 1;
  string status = 2;
  int32 version = 3;
}

message RetrieveRequest {
  string path_prefix = 1;
  string query = 2;
  int32 limit = 3;
  string api_key = 4;
}

message RetrieveEntry {
  int64 id = 1;
  string path = 2;
  string content = 3;
  int32 version = 4;
  double relevance_score = 5;
}

message RetrieveResponse {
  repeated RetrieveEntry entries = 1;
  int32 total = 2;
}

message BatchRetrieveQuery {
  string path_prefix = 1;
  string query = 2;
  int32 limit = 3;
}

message BatchRetrieveRequest {
  repeated BatchRetrieveQuery queries = 1;
  string api_key = 2;
}

message BatchRetrieveResult {
  repeated RetrieveEntry entries = 1;
  int32 total = 2;
}

message BatchRetrieveResponse {
  repeated BatchRetrieveResult results = 1;
  int32 total = 2;
}

message RetrieveStreamHeader {
  int32 total = 1;
}

message RetrieveStreamMsg {
  oneof msg {
    RetrieveStreamHeader header = 1;
    RetrieveEntry entry = 2;
  }
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
}
